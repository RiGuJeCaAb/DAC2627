# Só no documento para o professor (python -m tools.ponto8). Uma frase por parágrafo.
documento:
  ficheiro: Ponto8_Lab4_SharePoint_Dataverse_SQL
  capa:
    titulo: Origens de dados para o Power Apps
    subtitulo: SharePoint, Dataverse e SQL (Lab 4, ponto 8)
    autor: Ricardo Abreu
    docente: Pedro Almeida
    local_data: Lamego, novembro de 2026
  nome_curto: {Sp: o SharePoint, Dv: o Dataverse, Sql: o Azure SQL Database}
  introducao:
    - O ponto 8 do Lab 4 pede uma comparação entre três origens de dados que o Microsoft Power Apps usa para guardar informação.
    - As três são as listas do SharePoint, o Microsoft Dataverse e uma base de dados SQL, aqui o Azure SQL Database.
    - A Ficha 04 da APP DAC2627 guarda clientes e pedidos no Dataverse, numa relação de um para muitos com eliminação restrita.
    - Os capítulos I a III apresentam cada origem, o que é e os fatores positivos e menos positivos.
    - O capítulo IV compara as três pelos sete critérios do enunciado e por dois critérios da perspetiva cloud, o modelo de serviço e o custo.
    - O capítulo V aplica a comparação a duas questões de análise.
    - A informação técnica segue a documentação oficial da Microsoft, consultada em novembro de 2026.
    - O mesmo conteúdo está no ecrã «Origens de dados» da aplicação, aberto pelo quinto cartão do ecrã inicial.
  comparacao_intro:
    - A Tabela 1 resume os capítulos anteriores pelos sete critérios do enunciado do Lab 4.
    - As duas últimas linhas, o modelo de serviço cloud e o custo, acrescentam a perspetiva da Computação Cloud.
    - A coluna do Dataverse corresponde à opção tomada na Ficha 04.
  tabela_legenda: Tabela 1. Comparação das três origens de dados pelos critérios do Lab 4
  # Capítulo V. Uma frase por parágrafo na resposta.
  questoes:
    - pergunta: >-
        A Ficha 04 usa uma relação de um para muitos com eliminação restrita no Dataverse.
        O que aconteceria com a mesma relação entre duas listas do SharePoint, com 6000 pedidos?
      refs: [lookup, lvt, dvintro]
      resposta:
        - No SharePoint, a relação faz-se com uma coluna de pesquisa entre as duas listas.
        - A eliminação restrita ou em cascata não se ativa numa lista com mais itens do que o limiar de vista, que é de 5000.
        - Com 6000 pedidos já não se podia ativar a regra que impede apagar um cliente com pedidos, e essa proteção teria de passar para a app ou para um fluxo.
        - No Dataverse, a eliminação restrita é uma propriedade da relação e é aplicada pelo serviço, seja qual for o número de registos.
    - pergunta: >-
        Uma app em Dataverse passa a ter o triplo dos utilizadores e muito mais pedidos.
        Que custos crescem?
      refs: [lic, capac, sqlcompra]
      resposta:
        - Cresce o licenciamento, porque o conector do Dataverse é premium e cada utilizador da app precisa de uma licença Power Apps.
        - Cresce a capacidade de armazenamento, que no Dataverse se mede em GB de base de dados, ficheiros e registos de auditoria.
        - Cada licença acrescenta alguma capacidade ao conjunto do inquilino, mas o que passar disso paga-se à parte.
        - No Azure SQL, o mesmo crescimento pagava-se em computação (vCores ou DTU) e armazenamento, além das licenças premium do Power Apps.
