# Ponto 8 do Lab 4: SharePoint, Dataverse e SQL.
# Fonte única do ecrã scrL4Complemento (migração m004) e do documento para o professor
# (python -m tools.ponto8). Mudar aqui e voltar a gerar os dois. Cada afirmação tem fonte em `fontes`.

titulo: SharePoint, Dataverse e SQL
intro: >-
  Ponto 8 do Lab 4. A Ficha 04 guarda clientes e pedidos no Dataverse, mas o Power Apps
  trabalha com outras origens de dados. Primeiro, o que é cada uma e o que tem a favor e contra.
  No fim, a tabela compara as três pelos sete critérios do enunciado e por mais dois da
  perspetiva cloud: o modelo de serviço e o custo.

servicos:
  - id: Sp
    nome: SharePoint (listas)
    refs: [lvt, lookup, lic, deleg, spsaas]
    oque: >-
      Listas de um site SharePoint do Microsoft 365, as mesmas da aplicação Microsoft Lists.
      Cada lista é uma tabela simples de colunas, pensada para colaboração, com vistas,
      formulários e as permissões do site. É software como serviço (SaaS): a Microsoft gere
      servidores, atualizações e disponibilidade, e o cliente só usa as listas. O limiar de
      5000 itens existe para manter um desempenho igual para todos os utilizadores do serviço.
    favor:
      - Vem com o Microsoft 365. O conector é standard e não pede licença premium.
      - Tem interface pronta no browser, com vistas, filtros, formulários e exportação para Excel.
      - Liga listas por colunas de pesquisa, com eliminação restrita ou em cascata.
      - Monta-se depressa e quem já usa o Microsoft 365 reconhece-a.
    contra:
      - Uma consulta não processa mais de 5000 itens de cada vez (limiar de vista). Acima disso, só com colunas indexadas e filtros.
      - Uma vista aceita no máximo 12 colunas de pesquisa.
      - A eliminação restrita ou em cascata não se ativa numa lista com mais itens do que o limiar de vista.
      - Tipos de dados simples, sem regras de negócio no servidor nem segurança por coluna.
      - Uma fórmula que o SharePoint não consegue delegar só trabalha com os primeiros 500 registos (até 10 000, se se aumentar o limite da app).
  - id: Dv
    nome: Dataverse
    refs: [dvintro, dvlogica, dvseg, dvcol, mda, alm, payg, lic]
    oque: >-
      Base de dados relacional gerida pela Microsoft, dentro de um ambiente Power Platform.
      Guarda tabelas com tipos ricos, relações, regras de negócio e segurança por funções,
      e é a origem de dados das apps baseadas em modelo. É a que a Ficha 04 usa. Funciona como
      uma plataforma gerida (PaaS): a Microsoft trata da infraestrutura e quem desenvolve trabalha
      só com tabelas, relações e regras. Cada ambiente tem a sua base de dados, e as soluções levam
      tabelas, apps e fluxos de um ambiente para outro.
    favor:
      - Relações 1:N e N:N nativas, com eliminação restrita, em cascata ou só a remover a ligação.
      - Regras de negócio, colunas calculadas e fluxos aplicam-se em todas as apps que usam a tabela.
      - Segurança por funções (criar, ler, escrever, eliminar), equipas e unidades de negócio.
      - 'Segurança por coluna: um perfil de segurança de coluna esconde dados sensíveis, como os protegidos pelo RGPD, a quem não os deve ver.'
      - Ciclo de vida (ALM) com soluções. Não geridas no ambiente de desenvolvimento, geridas nos de teste e produção.
      - Gera apps baseadas em modelo, com formulários e vistas responsivos feitos a partir das tabelas.
      - Delegação ampla no Power Apps e integração direta com Power Automate e Power BI.
    contra:
      - O conector é premium. Cada utilizador da app precisa de uma licença Power Apps paga.
      - A capacidade de armazenamento paga-se por GB. Em pagamento por utilização, cada GB de base de dados acima do incluído custa 48 USD por mês (preço de novembro de 2026).
      - Prende a solução ao Power Platform e tem regras de modelação próprias.
  - id: Sql
    nome: SQL (Azure SQL Database)
    refs: [sqlpaas, sqlcompra, sqlcon, sqlarq, licfaq]
    oque: >-
      O motor SQL Server como serviço na cloud do Azure. A app liga-se pelo conector SQL Server
      e trabalha com tabelas, vistas e procedimentos armazenados escritos em T-SQL. É uma plataforma
      como serviço (PaaS): a Microsoft trata das atualizações, das correções, das cópias de segurança
      e da monitorização. A computação compra-se por vCores ou por DTU, e um conjunto elástico
      partilha os mesmos recursos entre várias bases de dados.
    favor:
      - Modelo relacional completo, com chaves estrangeiras, índices, vistas e procedimentos.
      - Consultas complexas no servidor. O Power Fx chama procedimentos armazenados diretamente.
      - Os dados servem também outros sistemas e relatórios, fora do Power Platform.
      - É a escolha natural quando os dados já estão em SQL e não podem sair de lá.
      - A computação escala à parte do armazenamento, por vCores ou DTU, e os conjuntos elásticos poupam quando há várias bases de dados.
    contra:
      - O conector é premium, e a base de dados no Azure paga-se à parte.
      - Não tem interface pronta. Tudo o que o utilizador vê tem de ser construído.
      - Pede administração de base de dados (esquema, segurança, cópias de segurança, desempenho).
      - Nem todas as operações do Power Fx são delegadas. O que não é passa para vistas ou procedimentos.

# Os sete critérios do enunciado do Lab 4, pela ordem do enunciado, e dois da perspetiva cloud.
tab_intro: >-
  Os sete critérios do enunciado do Lab 4 e dois da perspetiva cloud, lado a lado.
  A coluna Dataverse é a origem usada na Ficha 04.
criterios:
  - criterio: Estrutura
    Sp: Listas com colunas simples (texto, número, escolha, data, pessoa, pesquisa).
    Dv: Tabelas com tipos ricos (moeda, número automático, escolha, pesquisa) e metadados.
    Sql: Tabelas, tipos e índices definidos em T-SQL por quem desenha a base de dados.
  - criterio: Relações
    Sp: Coluna de pesquisa entre listas. Restrita ou em cascata só abaixo de 5000 itens.
    Dv: 1:N e N:N nativas, com Restringir, Em cascata ou Remover ligação.
    Sql: Chaves estrangeiras com ON DELETE e integridade referencial completa.
  - criterio: Desenvolvimento Power Apps
    Sp: Conector standard. Delegação parcial.
    Dv: Conector premium. Delegação ampla, escolhas e vistas no Filter.
    Sql: Conector premium. Delegação parcial, com vistas e procedimentos para o resto.
  - criterio: Interface pronta
    Sp: Sim. Microsoft Lists no browser, com vistas e formulários.
    Dv: Sim. App baseada em modelo gerada a partir das tabelas.
    Sql: Não. A interface tem de ser construída.
  - criterio: Lógica
    Sp: Validação simples nas colunas e fluxos do Power Automate.
    Dv: Regras de negócio, colunas calculadas e fluxos, aplicados no servidor.
    Sql: Restrições, gatilhos e procedimentos armazenados em T-SQL.
  - criterio: Gestão
    Sp: Dono do site no Microsoft 365, com as permissões do site e da lista.
    Dv: Centro de administração do Power Platform, com ambientes, funções e soluções.
    Sql: Portal do Azure (escalão, firewall, cópias, utilizadores). Pede um administrador de base de dados.
  - criterio: Caso de uso sugerido
    Sp: Listas simples e colaborativas, poucos milhares de registos, sem licenças premium.
    Dv: Apps de negócio com relações, regras e segurança por funções, como esta ficha.
    Sql: Dados que já vivem em SQL, grandes volumes ou partilhados com outros sistemas.
  # Dois critérios a mais, da perspetiva da unidade curricular (Computação Cloud).
  - criterio: Modelo de serviço cloud
    Sp: SaaS. Faz parte do Microsoft 365 e a Microsoft gere tudo.
    Dv: Plataforma gerida (PaaS), com uma base de dados por ambiente.
    Sql: PaaS do Azure. Computação por vCores ou DTU, e conjuntos elásticos.
  - criterio: Custo e licenciamento
    Sp: Incluído no Microsoft 365. Conector standard.
    Dv: Licença Power Apps premium por utilizador e capacidade de armazenamento por GB.
    Sql: Licença Power Apps premium e a base de dados no Azure (computação e armazenamento).

conclusao: >-
  A Ficha 04 usa Dataverse: relação 1:N com Restringir, número automático, vistas no Filter
  e delegação ampla, tudo dentro da solução DAC2627. O preço é a licença premium.
  Com poucos clientes e sem essas licenças, uma lista SharePoint chegava. Com os dados já num
  servidor SQL, o conector SQL Server evitava migrá-los. Na perspetiva cloud, os três são
  serviços geridos pela Microsoft, mas com modelos diferentes. O SharePoint é SaaS e só se usa,
  o Dataverse e o Azure SQL são plataformas sobre as quais se constrói a aplicação.

