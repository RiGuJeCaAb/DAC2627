documento:
  ficheiro: Ponto8_Lab4_SharePoint_Dataverse_SQL
  capa:
    titulo: Origens de dados para o Power Apps
    subtitulo: SharePoint, Dataverse e SQL (Lab 4, ponto 8)
    autor: Ricardo Abreu
    docente: Pedro Almeida
    local_data: Lamego, novembro de 2026
  introducao:
  - No Microsoft Power Apps, escolher onde guardar os dados não é apenas uma questão de modelação. É uma decisão
    de arquitetura cloud, que determina o modelo de serviço, quem gere a infraestrutura, a forma de controlar o
    acesso, até onde a solução escala e como é faturada. Uma app pode ter o mesmo aspeto sobre três origens diferentes
    e comportar-se de maneira muito distinta quando os dados ou os utilizadores crescem.
  - 'O ponto 8 do Lab 4 pede uma comparação entre três dessas origens: as listas do SharePoint, o Microsoft Dataverse
    e uma base de dados SQL, que neste trabalho é o Azure SQL Database. A Ficha 04 da APP DAC2627 guarda clientes
    e pedidos no Dataverse, numa relação de um para muitos com eliminação restrita, e serve de referência para a
    comparação.'
  - 'Os capítulos I a III apresentam cada origem com a mesma estrutura: a fundamentação arquitetural, um aspeto
    técnico que a distingue, os fatores positivos e menos positivos e uma síntese. O capítulo IV reúne tudo numa
    matriz com os sete critérios do enunciado e dois da perspetiva cloud, o modelo de serviço e o custo, e o capítulo
    V aplica a comparação a duas questões de análise. A informação técnica segue a documentação oficial da Microsoft,
    consultada em novembro de 2026, e o mesmo conteúdo está no ecrã «Origens de dados» da aplicação.'
  comparacao_intro:
  - A Tabela 1 resume os capítulos anteriores. As sete primeiras linhas são os critérios do enunciado do Lab 4,
    e as duas últimas, o modelo de serviço cloud e o custo, acrescentam a perspetiva da Computação Cloud. A coluna
    do Dataverse corresponde à opção tomada na Ficha 04.
  tabela_legenda: Tabela 1. Comparação das três origens de dados pelos critérios do Lab 4
  questoes:
  - titulo: Eliminação restrita com 6000 pedidos
    pergunta: A Ficha 04 usa uma relação de um para muitos com eliminação restrita no Dataverse. O que aconteceria
      com a mesma relação entre duas listas do SharePoint, com 6000 pedidos?
    refs:
    - lookup
    - lvt
    - dvintro
    resposta:
    - No SharePoint, a relação entre clientes e pedidos faz-se com uma coluna de pesquisa na lista de pedidos, e
      a eliminação restrita é uma opção dessa coluna. Essa opção, porém, não se pode ativar numa lista com mais
      itens do que o limiar de vista, que é de 5000. Com 6000 pedidos, a regra que impede apagar um cliente com
      pedidos já não podia ser ligada, e a proteção teria de passar para a app ou para um fluxo, onde depende de
      cada programador não se esquecer dela.
    - No Dataverse, a eliminação restrita é uma propriedade da relação e é aplicada pelo próprio serviço, seja qual
      for o número de registos e seja qual for a app que tenta apagar o cliente. A regra que na Ficha 04 se configura
      uma vez fica assim garantida em qualquer cenário.
  - titulo: Os custos de uma app que cresce
    pergunta: Uma app em Dataverse passa a ter o triplo dos utilizadores e muito mais pedidos. Que custos crescem?
    refs:
    - lic
    - capac
    - sqlcompra
    resposta:
    - Crescem dois custos. O primeiro é o licenciamento, porque o conector do Dataverse é premium e cada novo utilizador
      da app precisa de uma licença Power Apps. O segundo é a capacidade de armazenamento, que no Dataverse se mede
      em GB de base de dados, de ficheiros e de registos de auditoria. Cada licença acrescenta alguma capacidade
      ao conjunto do inquilino, mas o que passar disso paga-se à parte.
    - Se os dados estivessem no Azure SQL Database, as licenças premium do Power Apps continuavam a ser necessárias,
      porque o conector SQL Server também é premium. A diferença estaria na base de dados, que se pagaria em computação,
      por vCores ou DTU, e em armazenamento, e que poderia escalar uma coisa sem a outra.
