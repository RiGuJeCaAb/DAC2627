Screens:
  scrL1BoasVindas:
    Properties:
      Fill: =nfFundo
    Children:
      - conEcraL1a:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfFundo
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - conCabL1a:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =nfAzul
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - icoInicioL1a:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Voltar ao início"
                        Color: =Color.White
                        Height: =44
                        Icon: =Icon.Home
                        OnSelect: =Navigate(scrInicio, ScreenTransition.UnCover)
                        Width: =44
                  - lblCabL1a:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Size: =16
                        Text: ="Ficha 01 · Hello Cloud"
            - conConteudoL1a:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  PaddingBottom: =If(scrL1BoasVindas.Size = ScreenSize.Small, 16, 24)
                  PaddingLeft: =If(scrL1BoasVindas.Size = ScreenSize.Small, 16, 24)
                  PaddingRight: =If(scrL1BoasVindas.Size = ScreenSize.Small, 16, 24)
                  PaddingTop: =If(scrL1BoasVindas.Size = ScreenSize.Small, 16, 24)
                Children:
                  - conL1aCartao:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =Color.White
                        FillPortions: =0
                        Height: =If(scrL1BoasVindas.Size = ScreenSize.Small, 400, 400)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =20
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        PaddingBottom: =If(scrL1BoasVindas.Size = ScreenSize.Small, 24, 40)
                        PaddingLeft: =If(scrL1BoasVindas.Size = ScreenSize.Small, 24, 40)
                        PaddingRight: =If(scrL1BoasVindas.Size = ScreenSize.Small, 24, 40)
                        PaddingTop: =If(scrL1BoasVindas.Size = ScreenSize.Small, 24, 40)
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Width: =Min(640, Parent.Width - If(scrL1BoasVindas.Size = ScreenSize.Small, 32, 48))
                      Children:
                        - lblL1Titulo:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =nfTexto
                              FontWeight: =FontWeight.Bold
                              Size: =If(scrL1BoasVindas.Size = ScreenSize.Small, 28, 36)
                              Text: ="Bem-vindo à Cloud"
                        - lblL1Subtitulo:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =nfTextoSuave
                              Size: =15
                              Text: ="A sua primeira aplicação Power Apps, criada, executada e partilhada a partir da cloud."
                        - btnL1Comecar:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Color: =Color.White
                              Fill: =nfAzul
                              Height: =52
                              OnSelect: =Navigate(scrL1Pedido, ScreenTransition.Cover)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Text: ="Começar"
                              Width: =220
