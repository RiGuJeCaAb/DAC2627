Screens:
  scrL4Pedidos:
    Properties:
      Fill: =nfFundo
      OnVisible: |-
        =UpdateContext({locL4Vista: "todos", locL4Painel: false, locL4Cliente: Blank(), locL4Pedido: Blank(), locL4Modo: "", locL4Acao: "", locL4Confirmar: "", locL4UltimaConf: "", locL4Msg: "", locL4MsgTipo: "", locL4Timer: false}); ResetForm(frmL4Cliente); ResetForm(frmL4Pedido)
    Children:
      - conEcraL4:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfFundo
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - conCabL4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =nfAzul
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - icoInicioL4:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Voltar ao início"
                        Color: =Color.White
                        Height: =44
                        Icon: =Icon.Home
                        OnSelect: =Navigate(scrInicio, ScreenTransition.UnCover)
                        TabIndex: =0
                        Width: =44
                  - lblCabL4:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        FillPortions: =1
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Size: =16
                        Text: ="Ficha 04 · Clientes e Pedidos"
            - conConteudoL4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  PaddingBottom: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                  PaddingLeft: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                  PaddingRight: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                  PaddingTop: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                Children:
                  - conL4Barra:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(scrL4Pedidos.Size = ScreenSize.Small, 108, 52)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutWrap: =true
                        Visible: =!(scrL4Pedidos.Size = ScreenSize.Small && locL4Painel)
                      Children:
                        - txtL4Pesquisa:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              AccessibleLabel: ="Pesquisar clientes pelo início do nome"
                              Default: =""
                              FillPortions: =1
                              Height: =48
                              HintText: ="Pesquisar cliente pelo início do nome"
                              LayoutMinWidth: =220
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                        - lblL4Contagem:
                            Control: Label@2.5.1
                            Properties:
                              Color: =nfTextoSuave
                              FocusedBorderThickness: =2
                              Height: =48
                              Size: =If(scrL4Pedidos.Size = ScreenSize.Small, 12, 13)
                              Text: |-
                                =With({n: CountRows(Filter(Clientes, StartsWith(Nome, txtL4Pesquisa.Text)))},
                                    If(n = 1, "1 cliente", n & " clientes"))
                              Width: =If(scrL4Pedidos.Size = ScreenSize.Small, 110, 120)
                        - btnL4TodosPedidos:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =nfAzul
                              Color: =If(IsBlank(locL4Cliente) && scrL4Pedidos.Size > ScreenSize.Small, Color.White, nfAzul)
                              DisplayMode: =If(IsBlank(locL4Modo), DisplayMode.Edit, DisplayMode.Disabled)
                              Fill: =If(IsBlank(locL4Cliente) && scrL4Pedidos.Size > ScreenSize.Small, nfAzul, Color.White)
                              Height: =48
                              OnSelect: |-
                                =UpdateContext({locL4Cliente: Blank(), locL4Painel: true})
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Text: ="Todos os pedidos"
                              Width: =If(scrL4Pedidos.Size = ScreenSize.Small, 200, 190)
                  - conL4Corpo:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =24
                      Children:
                        - conL4Lista:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.White
                              FillPortions: =If(scrL4Pedidos.Size = ScreenSize.Medium, 1, 2)
                              LayoutDirection: =LayoutDirection.Vertical
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: =scrL4Pedidos.Size > ScreenSize.Small || !locL4Painel
                            Children:
                              - lblL4ListaTitulo:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =nfTextoSuave
                                    FocusedBorderThickness: =2
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    PaddingLeft: =20
                                    Size: =12
                                    Text: ="CLIENTES"
                              - lblL4ListaVazia:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =nfTextoSuave
                                    FocusedBorderThickness: =2
                                    Height: =80
                                    Text: ="Nenhum cliente começa por este texto."
                                    Visible: =IsEmpty(galL4Clientes.AllItems)
                              - galL4Clientes:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    AccessibleLabel: ="Lista de clientes"
                                    DisplayMode: =If(IsBlank(locL4Modo), DisplayMode.Edit, DisplayMode.Disabled)
                                    Items: =Sort(Filter(Clientes, StartsWith(Nome, txtL4Pesquisa.Text)), Nome)
                                    OnSelect: |-
                                      =UpdateContext({locL4Cliente: galL4Clientes.Selected, locL4Painel: true})
                                    TabIndex: =0
                                    TemplateFill: =If(!IsBlank(locL4Cliente) && ThisItem.Cliente = locL4Cliente.Cliente, nfAzulClaro, Color.White)
                                    TemplatePadding: =0
                                    TemplateSize: =72
                                  Children:
                                    - lblL4CliNome:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =nfTexto
                                          FontWeight: =FontWeight.Semibold
                                          Height: =28
                                          OnSelect: =Select(Parent)
                                          Size: =14
                                          Text: =ThisItem.Nome
                                          Width: =Parent.TemplateWidth - 60
                                          Wrap: =false
                                          X: =20
                                          Y: =12
                                    - lblL4CliInfo:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =nfTextoSuave
                                          Height: =22
                                          OnSelect: =Select(Parent)
                                          Size: =12
                                          Text: ="NIF " & ThisItem.NIF & "  ·  " & ThisItem.Telefone
                                          Width: =Parent.TemplateWidth - 60
                                          Wrap: =false
                                          X: =20
                                          Y: =40
                                    - icoL4CliSeta:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          Color: =nfTextoSuave
                                          Height: =24
                                          Icon: =Icon.ChevronRight
                                          OnSelect: =Select(Parent)
                                          Width: =24
                                          X: =Parent.TemplateWidth - 40
                                          Y: =24
                                    - recL4CliSeparador:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =nfLinha
                                          Height: =1
                                          Width: =Parent.TemplateWidth
                                          Y: =Parent.TemplateHeight - 1
                        - conL4Painel:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.White
                              FillPortions: =If(scrL4Pedidos.Size = ScreenSize.Medium, 1, 3)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              PaddingBottom: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                              PaddingLeft: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                              PaddingRight: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                              PaddingTop: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: =scrL4Pedidos.Size > ScreenSize.Small || locL4Painel
                            Children:
                              - conL4PainelTopo:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =12
                                  Children:
                                    - btnL4VoltarLista:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          Color: =nfAzul
                                          Fill: =Color.White
                                          Height: =44
                                          OnSelect: |-
                                            =UpdateContext({locL4Painel: false})
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Text: ="‹ Clientes"
                                          Visible: =scrL4Pedidos.Size = ScreenSize.Small && IsBlank(locL4Modo)
                                          Width: =116
                                    - lblL4PainelTitulo:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =nfTexto
                                          FillPortions: =1
                                          FocusedBorderThickness: =2
                                          FontWeight: =FontWeight.Bold
                                          Height: =44
                                          Size: =If(scrL4Pedidos.Size = ScreenSize.Small, 18, 22)
                                          Text: =Switch(locL4Modo, "cliente", If(locL4Acao = "criar", "Novo cliente", "Editar cliente"), "pedido", If(locL4Acao = "criar", "Novo pedido · " & locL4Cliente.Nome, "Pedido " & locL4Pedido.NumeroPedido), If(IsBlank(locL4Cliente), "Todos os clientes", locL4Cliente.Nome))
                                          Wrap: =false
                              - lblL4ClienteDados:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =nfTextoSuave
                                    FocusedBorderThickness: =2
                                    Text: |-
                                      =If(IsBlank(locL4Cliente),
                                          "Pedidos de todos os clientes. Escolha um cliente na lista para ver só os dele.",
                                          "NIF " & locL4Cliente.NIF & "  ·  " & locL4Cliente.Email & "  ·  " & locL4Cliente.Telefone)
                                    Visible: =IsBlank(locL4Modo)
                              - conL4Separadores:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =48
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Visible: =IsBlank(locL4Modo)
                                  Children:
                                    - btnL4SepTodos:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          Color: =If(locL4Vista = "todos", Color.White, nfAzul)
                                          Fill: =If(locL4Vista = "todos", nfAzul, Color.White)
                                          FillPortions: =1
                                          Height: =48
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =UpdateContext({locL4Vista: "todos"})
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Size: =Switch(scrL4Pedidos.Size, ScreenSize.Small, 11, ScreenSize.Medium, 11, 13)
                                          Text: ="Todos (" & If(IsBlank(locL4Cliente), CountRows(Filter(Pedidos, Estado = 'Estado (Pedidos)'.Ativo)), CountRows(Filter(Pedidos, Estado = 'Estado (Pedidos)'.Ativo && Clientes.Cliente = locL4Cliente.Cliente))) & ")"
                                          Width: =150
                                    - btnL4SepPendentes:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          Color: =If(locL4Vista = "pendentes", Color.White, nfAzul)
                                          Fill: =If(locL4Vista = "pendentes", nfAzul, Color.White)
                                          FillPortions: =1
                                          Height: =48
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =UpdateContext({locL4Vista: "pendentes"})
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Size: =Switch(scrL4Pedidos.Size, ScreenSize.Small, 11, ScreenSize.Medium, 11, 13)
                                          Text: =If(scrL4Pedidos.Size >= ScreenSize.ExtraLarge, "Pedidos Pendentes (", "Pendentes (") & If(IsBlank(locL4Cliente), CountRows(Filter(Pedidos, EstadoPedido = 'EstadoPedido (Pedidos)'.Pendente)), CountRows(Filter(Pedidos, EstadoPedido = 'EstadoPedido (Pedidos)'.Pendente && Clientes.Cliente = locL4Cliente.Cliente))) & ")"
                                          Width: =220
                                    - btnL4SepConcluidos:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          Color: =If(locL4Vista = "concluidos", Color.White, nfAzul)
                                          Fill: =If(locL4Vista = "concluidos", nfAzul, Color.White)
                                          FillPortions: =1
                                          Height: =48
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =UpdateContext({locL4Vista: "concluidos"})
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Size: =Switch(scrL4Pedidos.Size, ScreenSize.Small, 11, ScreenSize.Medium, 11, 13)
                                          Text: =If(scrL4Pedidos.Size >= ScreenSize.ExtraLarge, "Pedidos Concluídos (", "Concluídos (") & If(IsBlank(locL4Cliente), CountRows(Filter(Pedidos, EstadoPedido = 'EstadoPedido (Pedidos)'.Concluído)), CountRows(Filter(Pedidos, EstadoPedido = 'EstadoPedido (Pedidos)'.Concluído && Clientes.Cliente = locL4Cliente.Cliente))) & ")"
                                          Width: =230
                              - lblL4Resumo:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =nfTexto
                                    FocusedBorderThickness: =2
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    Text: =Switch(locL4Vista, "pendentes", "Vista do Dataverse «Pedidos Pendentes» · mais recentes primeiro", "concluidos", "Vista do Dataverse «Pedidos Concluídos» · mais recentes primeiro", "Todos os pedidos ativos · mais recentes primeiro")
                                    Visible: =IsBlank(locL4Modo)
                              - lblL4SemPedidos:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =nfTextoSuave
                                    FocusedBorderThickness: =2
                                    Height: =80
                                    Text: =If(IsBlank(locL4Cliente), "Não há pedidos nesta vista.", "Este cliente não tem pedidos nesta vista.")
                                    Visible: =IsBlank(locL4Modo) && IsEmpty(galL4Pedidos.AllItems)
                              - galL4Pedidos:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    AccessibleLabel: ="Pedidos"
                                    Items: =Switch(locL4Vista, "pendentes", If(IsBlank(locL4Cliente), Sort(Filter(Pedidos, 'Pedidos (Vistas)'.'Pedidos Pendentes'), DataPedido, SortOrder.Descending), Sort(Filter(Pedidos, 'Pedidos (Vistas)'.'Pedidos Pendentes', Clientes.Cliente = locL4Cliente.Cliente), DataPedido, SortOrder.Descending)), "concluidos", If(IsBlank(locL4Cliente), Sort(Filter(Pedidos, 'Pedidos (Vistas)'.'Pedidos Concluídos'), DataPedido, SortOrder.Descending), Sort(Filter(Pedidos, 'Pedidos (Vistas)'.'Pedidos Concluídos', Clientes.Cliente = locL4Cliente.Cliente), DataPedido, SortOrder.Descending)), If(IsBlank(locL4Cliente), Sort(Filter(Pedidos, Estado = 'Estado (Pedidos)'.Ativo), DataPedido, SortOrder.Descending), Sort(Filter(Pedidos, Estado = 'Estado (Pedidos)'.Ativo && Clientes.Cliente = locL4Cliente.Cliente), DataPedido, SortOrder.Descending)))
                                    LayoutMinHeight: =0
                                    OnSelect: |-
                                      =UpdateContext({locL4Pedido: ThisItem, locL4Modo: "pedido", locL4Acao: "editar", locL4Msg: "", locL4Timer: false}); EditForm(frmL4Pedido)
                                    TabIndex: =0
                                    TemplatePadding: =0
                                    TemplateSize: =If(scrL4Pedidos.Size = ScreenSize.Small, 96, 80)
                                    Visible: =IsBlank(locL4Modo)
                                  Children:
                                    - lblL4PedNumero:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =nfTexto
                                          FontWeight: =FontWeight.Semibold
                                          Height: =28
                                          OnSelect: =Select(Parent)
                                          Size: =14
                                          Text: =ThisItem.NumeroPedido & If(IsBlank(locL4Cliente), "  ·  " & ThisItem.Clientes.Nome, "")
                                          Width: =Parent.TemplateWidth - If(scrL4Pedidos.Size = ScreenSize.Small, 120, 170)
                                          Wrap: =false
                                          X: =16
                                          Y: =10
                                    - lblL4PedDescricao:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =nfTextoSuave
                                          Height: =If(scrL4Pedidos.Size = ScreenSize.Small, 44, 24)
                                          OnSelect: =Select(Parent)
                                          Size: =12
                                          Text: =Text(ThisItem.DataPedido, "dd/mm/yyyy") & "  ·  " & ThisItem.Descrição
                                          VerticalAlign: =VerticalAlign.Top
                                          Width: =Parent.TemplateWidth - If(scrL4Pedidos.Size = ScreenSize.Small, 120, 170)
                                          Wrap: =scrL4Pedidos.Size = ScreenSize.Small
                                          X: =16
                                          Y: =40
                                    - lblL4PedValor:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Right
                                          Color: =nfTexto
                                          FontWeight: =FontWeight.Bold
                                          Height: =28
                                          OnSelect: =Select(Parent)
                                          Size: =14
                                          Text: =Text(ThisItem.Valor, "[$-pt-PT]0,00") & " €"
                                          Width: =If(scrL4Pedidos.Size = ScreenSize.Small, 100, 140)
                                          X: =Parent.TemplateWidth - If(scrL4Pedidos.Size = ScreenSize.Small, 112, 156)
                                          Y: =10
                                    - btnL4PedEstado:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderThickness: =0
                                          Color: =If(ThisItem.EstadoPedido = 'EstadoPedido (Pedidos)'.Pendente, nfAmbar, ThisItem.EstadoPedido = 'EstadoPedido (Pedidos)'.'Em Processamento', nfAzul, ThisItem.EstadoPedido = 'EstadoPedido (Pedidos)'.Concluído, nfVerdeTexto, nfVermelhoTexto)
                                          DisabledColor: =Self.Color
                                          DisabledFill: =Self.Fill
                                          DisplayMode: =DisplayMode.View
                                          Fill: =If(ThisItem.EstadoPedido = 'EstadoPedido (Pedidos)'.Pendente, nfAmbarFundo, ThisItem.EstadoPedido = 'EstadoPedido (Pedidos)'.'Em Processamento', nfAzulFundo, ThisItem.EstadoPedido = 'EstadoPedido (Pedidos)'.Concluído, nfVerdeFundo, nfVermelhoFundo)
                                          FontWeight: =FontWeight.Bold
                                          Height: =26
                                          HoverColor: =Self.Color
                                          HoverFill: =Self.Fill
                                          OnSelect: =Select(Parent)
                                          PressedFill: =Self.Fill
                                          RadiusBottomLeft: =13
                                          RadiusBottomRight: =13
                                          RadiusTopLeft: =13
                                          RadiusTopRight: =13
                                          Size: =11
                                          TabIndex: =-1
                                          Text: =Text(ThisItem.EstadoPedido)
                                          Width: =If(scrL4Pedidos.Size = ScreenSize.Small, 128, 140)
                                          X: =Parent.TemplateWidth - Self.Width - 16
                                          Y: =42
                                    - recL4PedSeparador:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =nfLinha
                                          Height: =1
                                          Width: =Parent.TemplateWidth
                                          Y: =Parent.TemplateHeight - 1
                              - frmL4Cliente:
                                  Control: Form@2.4.4
                                  Variant: Classic
                                  Layout: Vertical
                                  Properties:
                                    BorderColor: =nfBorda
                                    DataSource: =Clientes
                                    Item: =locL4Cliente
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnFailure: |-
                                      =UpdateContext({locL4MsgTipo: "erro", locL4Timer: false, locL4Msg: "Não foi possível guardar o cliente. " & frmL4Cliente.Error})
                                    OnSuccess: |-
                                      =UpdateContext({locL4Cliente: frmL4Cliente.LastSubmit, locL4Modo: "", locL4Painel: true, locL4MsgTipo: "ok", locL4Timer: true, locL4Msg: If(locL4Acao = "criar", "Cliente " & frmL4Cliente.LastSubmit.Nome & " criado.", "Alterações a " & frmL4Cliente.LastSubmit.Nome & " guardadas.")})
                                    Visible: =locL4Modo = "cliente"
                                  Children:
                                    - Nome_DataCard1:
                                        Control: TypedDataCard@1.0.7
                                        Variant: ClassicTextualEdit
                                        IsLocked: true
                                        Properties:
                                          BorderColor: =nfBorda
                                          DataField: ="dac_nome"
                                          Default: =ThisItem.Nome
                                          DisplayName: =DataSourceInfo([@Clientes],DataSourceInfo.DisplayName,dac_nome)
                                          MaxLength: =DataSourceInfo([@Clientes], DataSourceInfo.MaxLength, dac_nome)
                                          Required: =false
                                          Update: =txtL4CliNome.Text
                                          Width: =Switch(scrL4Pedidos.Size, ScreenSize.Small, Parent.Width - 1, ScreenSize.Medium, RoundDown(Parent.Width / 2, 0) - 1, RoundDown(Parent.Width / 3, 0) - 1)
                                          X: =0
                                          Y: =0
                                        Children:
                                          - DataCardKey6:
                                              Control: Label@2.5.1
                                              MetadataKey: FieldName
                                              Properties:
                                                AutoHeight: =true
                                                BorderColor: =nfBorda
                                                Color: =nfTexto
                                                FocusedBorderThickness: =2
                                                Font: =Font.'Open Sans'
                                                Height: =34
                                                Text: =Parent.DisplayName
                                                Width: =Parent.Width - 60
                                                Wrap: =false
                                                X: =30
                                                Y: =10
                                          - txtL4CliNome:
                                              Control: Classic/TextInput@2.3.2
                                              MetadataKey: FieldValue
                                              Properties:
                                                AccessibleLabel: =Parent.DisplayName
                                                BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, nfVermelho)
                                                Default: =Parent.Default
                                                DelayOutput: =true
                                                DisplayMode: =Parent.DisplayMode
                                                Font: =Font.'Open Sans'
                                                HoverBorderColor: =nfAzul
                                                HoverFill: =nfAzulFundo
                                                MaxLength: =Parent.MaxLength
                                                PaddingLeft: =5
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Tooltip: =Parent.DisplayName
                                                Width: =Parent.Width - 60
                                                X: =30
                                                Y: =DataCardKey6.Y + DataCardKey6.Height + 5
                                          - ErrorMessage6:
                                              Control: Label@2.5.1
                                              MetadataKey: ErrorMessage
                                              Properties:
                                                AutoHeight: =true
                                                BorderColor: =nfBorda
                                                Color: =nfVermelhoTexto
                                                FocusedBorderThickness: =2
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =10
                                                Live: =Live.Assertive
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
