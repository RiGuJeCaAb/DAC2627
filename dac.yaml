# Configuração do projeto APP DAC2627 (lida por python -m tools.dac ...)

app: DAC2627_RGJCA
solucao: DAC2627
versao: 1.7.0

# Ordem dos ecrãs na app e nos blocos de colagem (build/colar/TODOS_OS_ECRAS.yaml)
ecras:
  - scrInicio
  - scrL1BoasVindas
  - scrL1Pedido
  - scrL1Saudacao
  - scrL2Servicos
  - scrL3Lista
  - scrL3Detalhe
  - scrL3Publicacao
  - scrL4Pedidos
  - scrL4Complemento
  - scrL4Entrar

# Ecrãs que saíram da app: o ORDEM.md pede para os eliminar, se ainda lá estiverem.
# Na v1.7.0 o Melhoramento e a Revisão passaram a modos do scrL4Pedidos (m009).
retirados:
  - scrL4Melhoramento
  - scrL4Revisao

# Fontes de dados que a app usa. Os .yaml dos ecrãs referem-nas pelo nome mas não as trazem:
# têm de estar no painel Dados antes de colar (build/colar/ORDEM.md, passo 1).
# conjunto: nome do conjunto de entidades no Dataverse. dac colar compara-o com a última exportação
# (msapp/References/DataSources.json) para apanhar uma fonte em falta ou a tabela errada.
fontes:
  - nome: Cloud Service
    tipo: Tabela Dataverse
    conjunto: mcsft_cloudservices
    nota: Escolher a de nome lógico mcsft_cloudservice. O ambiente tem outra com o mesmo nome a mostrar (mcsft_cloudservice1).
  - nome: Clientes
    tipo: Tabela Dataverse
    conjunto: dac_clientes
    nota: Tabela Cliente, nome lógico dac_cliente.
  - nome: Pedidos
    tipo: Tabela Dataverse
    conjunto: dac_pedidos
    nota: Tabela Pedido, nome lógico dac_pedido.
    # uma coluna de cada versão: se a definição da tabela na app não as tiver, o ORDEM.md pede Atualizar
    colunas: [dac_tratamento, dac_registadopor]
  - nome: JSONPlaceholderDAC
    tipo: Conector personalizado
    nota: Usar a ligação existente do conector da solução DAC2627 (não o Defaulttitle do Lab 3).
  - nome: DAC2627_Pedido_Reprocessar
    tipo: Fluxo Power Automate
    nota: Fluxo instantâneo da Ficha 04 · Melhoramento (gatilho Power Apps V2, entrada PedidoId).
  - nome: Utilizadores
    tipo: Tabela Dataverse
    conjunto: dac_utilizadors
    nota: Tabela Utilizador (dac_utilizador) da Ficha 04 · Revisão. Na pesquisa aparece como Utilizadores.
  - nome: DAC2627_Utilizador_Entrar
    tipo: Fluxo Power Automate
    nota: Ficha 04 · Revisão, entradas Email e Password.
  - nome: DAC2627_Utilizador_DefinirPassword
    tipo: Fluxo Power Automate
    nota: Ficha 04 · Revisão, entradas Token, UtilizadorId, NovaPassword e PasswordAtual.
  - nome: DAC2627_Pedido_Decidir
    tipo: Fluxo Power Automate
    nota: Ficha 04 · Revisão, entradas Token, PedidoId, Acao e Comentario.

lint:
  # Tabelas Dataverse: dentro de Filter/LookUp sobre estas, Text(), Len(), in, ... não são delegáveis
  fontes_dataverse:
    - Cloud Service
    - Clientes
    - Pedidos
    - Utilizadores
  # Escala tipográfica (DAC501)
  tamanhos_letra: [11, 12, 13, 14, 15, 16, 18, 20, 22, 24, 26, 28, 30, 36, 40]
  # Cada exceção tem de dizer porquê. Uma exceção sem motivo é um erro (DAC900).
  excecoes:
    - regra: DAC302
      controlo: btnL2ItemModelo
      motivo: Pílula decorativa (botão sem ação a fazer de etiqueta arredondada); o foco vai para a linha da galeria.
    - regra: DAC302
      controlo: btnL3Iniciais
      motivo: Pílula decorativa com as iniciais; o foco vai para a linha da galeria.
    - regra: DAC302
      controlo: btnL3bIniciais
      motivo: Pílula decorativa com as iniciais no detalhe; não tem ação.
    - regra: DAC302
      controlo: btnL3PubIniciais
      motivo: Pílula decorativa com as iniciais do autor; a ação está no botão Ver autor ao lado.
    - regra: DAC302
      controlo: btnL4PedEstado
      motivo: Pílula decorativa com o estado do pedido; o foco vai para a linha da galeria.
    - regra: DAC302
      controlo: btnL4cTratamento
      motivo: Pílula decorativa com o tratamento do pedido no detalhe; a justificação do fluxo está nas linhas por baixo.
    - regra: DAC302
      controlo: btnL4cGTratamento
      motivo: Pílula decorativa com o tratamento do pedido (na Revisão, a decisão); o foco vai para a linha da galeria.
    - regra: DAC302
      controlo: btnL4dGUtilEstado
      motivo: Pílula decorativa com o estado do utilizador; o foco vai para a linha da galeria.
    - regra: DAC302
      controlo: btnL4dIniciais
      motivo: Pílula decorativa com as iniciais de quem entrou; o nome está ao lado.
    - regra: DAC302
      controlo: btnL4dPerfil
      motivo: Pílula decorativa com o perfil de quem entrou; não tem ação.
