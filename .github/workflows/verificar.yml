# Verificação automática: corre em cada push e pull request. Não precisa de credenciais.
name: Verificar

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write   # para publicar o SARIF do lint no separador Security

jobs:
  verificar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Validar YAML, schema oficial e sintaxe das fórmulas
        run: python -m tools.dac validar

      - name: Formato igual ao do Studio
        run: python -m tools.dac formatar --verificar

      - name: Lint (anotações no código)
        run: python -m tools.dac lint --formato github --estrito

      - name: Contraste da paleta e documentos gerados atualizados
        run: |
          python -m tools.dac paleta --verificar
          python -m tools.dac inventario --verificar

      - name: Testes das ferramentas
        run: python -m pytest

      - name: Diferenças por levar ao Studio (informativo)
        run: python -m tools.dac deriva

      - name: Blocos de colagem
        run: python -m tools.dac colar

      # Informativo: num ramo à frente da exportação faltam fontes na app até serem adicionadas no Studio.
      # Não faz falhar o CI; aparece como aviso no resumo da execução. Antes de colar: `dac colar --estrito`.
      - name: Fontes de dados contra a última exportação (informativo)
        run: |
          if ! python -m tools.dac colar --estrito --destino build/verificar-fontes > build/fontes.txt 2>&1; then
            echo "::warning title=Fontes por adicionar no Studio::$(grep -c 'ATENÇÃO' build/fontes.txt) fonte(s) usadas no código ainda não estão na app exportada. Ver o passo «Fontes de dados contra a última exportação»."
          fi
          grep 'ATENÇÃO' build/fontes.txt || echo "Todas as fontes usadas no código estão na app exportada."

      - uses: actions/upload-artifact@v7
        with:
          name: colar-no-studio
          path: build/colar/

      - name: Lint em SARIF
        if: always()
        run: python -m tools.dac lint --formato sarif > build/dac-lint.sarif || true

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        with:
          sarif_file: build/dac-lint.sarif
          category: dac-lint
