Screens:
  scrL4Complemento:
    Properties:
      Fill: =nfFundo
      OnVisible: |-
        =UpdateContext({locL4bVista: "texto"})
    Children:
      - conEcraL4b:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfFundo
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - conCabL4b:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =nfAzul
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - icoInicioL4b:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Voltar ao início"
                        Color: =Color.White
                        Height: =44
                        Icon: =Icon.Home
                        OnSelect: =Navigate(scrInicio, ScreenTransition.UnCover)
                        TabIndex: =0
                        Width: =44
                  - lblCabL4b:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        FillPortions: =1
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Size: =16
                        Text: ="Ficha 04 · Complemento"
            - conConteudoL4b:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutOverflow: =LayoutOverflow.Scroll
                  PaddingBottom: =If(scrL4Complemento.Size = ScreenSize.Small, 16, 24)
                  PaddingLeft: =Max(If(scrL4Complemento.Size = ScreenSize.Small, 16, 24), (Parent.Width - 1000) / 2)
                  PaddingRight: =Max(If(scrL4Complemento.Size = ScreenSize.Small, 16, 24), (Parent.Width - 1000) / 2)
                  PaddingTop: =If(scrL4Complemento.Size = ScreenSize.Small, 16, 24)
                Children:
                  - lblL4bTitulo:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Bold
                        Size: =If(scrL4Complemento.Size = ScreenSize.Small, 20, 24)
                        Text: =If(locL4bVista = "tabela", "Comparação por critério", "SharePoint, Dataverse e SQL")
                  - lblL4bIntro:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTextoSuave
                        FocusedBorderThickness: =2
                        Size: =14
                        Text: |-
                          ="Ponto 8 do Lab 4. A Ficha 04 guarda clientes e pedidos no Dataverse, mas o Power Apps trabalha com outras origens de dados. Primeiro, o que é cada uma e o que tem a favor e contra. No fim, a tabela compara as três pelos sete critérios do enunciado e por mais dois da perspetiva cloud: o modelo de serviço e o custo."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpNome:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAzul
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Bold
                        PaddingTop: =12
                        Size: =20
                        Text: ="SharePoint (listas)"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpOQue:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: |-
                          ="Listas de um site SharePoint do Microsoft 365, as mesmas da aplicação Microsoft Lists. Cada lista é uma tabela simples de colunas, pensada para colaboração, com vistas, formulários e as permissões do site. É software como serviço (SaaS): a Microsoft gere servidores, atualizações e disponibilidade, e o cliente só usa as listas. O limiar de 5000 itens existe para manter um desempenho igual para todos os utilizadores do serviço."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpFavorTit:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfVerdeTexto
                        Fill: =nfVerdeFundo
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        Size: =14
                        Text: ="A favor"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpFavor:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="• Vem com o Microsoft 365. O conector é standard e não pede licença premium." & Char(10) & "• Tem interface pronta no browser, com vistas, filtros, formulários e exportação para Excel." & Char(10) & "• Liga listas por colunas de pesquisa, com eliminação restrita ou em cascata." & Char(10) & "• Monta-se depressa e quem já usa o Microsoft 365 reconhece-a."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpContraTit:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAmbar
                        Fill: =nfAmbarFundo
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        Size: =14
                        Text: ="Contra"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpContra:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="• Uma consulta não processa mais de 5000 itens de cada vez (limiar de vista). Acima disso, só com colunas indexadas e filtros." & Char(10) & "• Uma vista aceita no máximo 12 colunas de pesquisa." & Char(10) & "• A eliminação restrita ou em cascata não se ativa numa lista com mais itens do que o limiar de vista." & Char(10) & "• Tipos de dados simples, sem regras de negócio no servidor nem segurança por coluna." & Char(10) & "• Uma fórmula que o SharePoint não consegue delegar só trabalha com os primeiros 500 registos (até 10 000, se se aumentar o limite da app)."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvNome:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAzul
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Bold
                        PaddingTop: =12
                        Size: =20
                        Text: ="Dataverse"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvOQue:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: |-
                          ="Base de dados relacional gerida pela Microsoft, dentro de um ambiente Power Platform. Guarda tabelas com tipos ricos, relações, regras de negócio e segurança por funções, e é a origem de dados das apps baseadas em modelo. É a que a Ficha 04 usa. Funciona como uma plataforma gerida (PaaS): a Microsoft trata da infraestrutura e quem desenvolve trabalha só com tabelas, relações e regras. Cada ambiente tem a sua base de dados, e as soluções levam tabelas, apps e fluxos de um ambiente para outro."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvFavorTit:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfVerdeTexto
                        Fill: =nfVerdeFundo
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        Size: =14
                        Text: ="A favor"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvFavor:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: |-
                          ="• Relações 1:N e N:N nativas, com eliminação restrita, em cascata ou só a remover a ligação." & Char(10) & "• Regras de negócio, colunas calculadas e fluxos aplicam-se em todas as apps que usam a tabela." & Char(10) & "• Segurança por funções (criar, ler, escrever, eliminar), equipas e unidades de negócio." & Char(10) & "• Segurança por coluna: um perfil de segurança de coluna esconde dados sensíveis, como os protegidos pelo RGPD, a quem não os deve ver." & Char(10) & "• Ciclo de vida (ALM) com soluções. Não geridas no ambiente de desenvolvimento, geridas nos de teste e produção." & Char(10) & "• Gera apps baseadas em modelo, com formulários e vistas responsivos feitos a partir das tabelas." & Char(10) & "• Delegação ampla no Power Apps e integração direta com Power Automate e Power BI."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvContraTit:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAmbar
                        Fill: =nfAmbarFundo
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        Size: =14
                        Text: ="Contra"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvContra:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="• O conector é premium. Cada utilizador da app precisa de uma licença Power Apps paga." & Char(10) & "• A capacidade de armazenamento paga-se por GB. Em pagamento por utilização, cada GB de base de dados acima do incluído custa 48 USD por mês (preço de novembro de 2026)." & Char(10) & "• Prende a solução ao Power Platform e tem regras de modelação próprias."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSqlNome:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAzul
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Bold
                        PaddingTop: =12
                        Size: =20
                        Text: ="SQL (Azure SQL Database)"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSqlOQue:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: |-
                          ="O motor SQL Server como serviço na cloud do Azure. A app liga-se pelo conector SQL Server e trabalha com tabelas, vistas e procedimentos armazenados escritos em T-SQL. É uma plataforma como serviço (PaaS): a Microsoft trata das atualizações, das correções, das cópias de segurança e da monitorização. A computação compra-se por vCores ou por DTU, e um conjunto elástico partilha os mesmos recursos entre várias bases de dados."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSqlFavorTit:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfVerdeTexto
                        Fill: =nfVerdeFundo
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        Size: =14
                        Text: ="A favor"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSqlFavor:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="• Modelo relacional completo, com chaves estrangeiras, índices, vistas e procedimentos." & Char(10) & "• Consultas complexas no servidor. O Power Fx chama procedimentos armazenados diretamente." & Char(10) & "• Os dados servem também outros sistemas e relatórios, fora do Power Platform." & Char(10) & "• É a escolha natural quando os dados já estão em SQL e não podem sair de lá." & Char(10) & "• A computação escala à parte do armazenamento, por vCores ou DTU, e os conjuntos elásticos poupam quando há várias bases de dados."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSqlContraTit:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAmbar
                        Fill: =nfAmbarFundo
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        Size: =14
                        Text: ="Contra"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSqlContra:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="• O conector é premium, e a base de dados no Azure paga-se à parte." & Char(10) & "• Não tem interface pronta. Tudo o que o utilizador vê tem de ser construído." & Char(10) & "• Pede administração de base de dados (esquema, segurança, cópias de segurança, desempenho)." & Char(10) & "• Nem todas as operações do Power Fx são delegadas. O que não é passa para vistas ou procedimentos."
                        Visible: =locL4bVista <> "tabela"
                  - btnL4bVerTabela:
                      Control: Classic/Button@2.2.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        BorderColor: =nfAzul
                        Color: =Color.White
                        Fill: =nfAzul
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        HoverColor: =Color.White
                        HoverFill: =nfAzul
                        OnSelect: |-
                          =UpdateContext({locL4bVista: "tabela"})
                        PressedColor: =Color.White
                        PressedFill: =nfAzul
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Size: =14
                        TabIndex: =0
                        Text: ="Ver a tabela comparativa"
                        Visible: =locL4bVista <> "tabela"
                        Width: =If(scrL4Complemento.Size = ScreenSize.Small, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight, 280)
                  - lblL4bTabIntro:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTextoSuave
                        FocusedBorderThickness: =2
                        Size: =14
                        Text: ="Os sete critérios do enunciado do Lab 4 e dois da perspetiva cloud, lado a lado. A coluna Dataverse é a origem usada na Ficha 04."
                        Visible: =locL4bVista = "tabela"
                  - conL4bCabecalho:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =nfLinha
                        FillPortions: =0
                        Height: =48
                        LayoutDirection: =LayoutDirection.Horizontal
                        Visible: =locL4bVista = "tabela" && scrL4Complemento.Size > ScreenSize.Small
                      Children:
                        - lblL4bCabCriterio:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =nfTexto
                              FocusedBorderThickness: =2
                              FontWeight: =FontWeight.Bold
                              PaddingLeft: =16
                              Size: =14
                              Text: ="Critério"
                              Width: =If(scrL4Complemento.Size = ScreenSize.Medium, 150, 190)
                        - lblL4bCabSharePoint:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =nfTexto
                              FillPortions: =1
                              FocusedBorderThickness: =2
                              FontWeight: =FontWeight.Bold
                              PaddingLeft: =12
                              Size: =14
                              Text: ="SharePoint (listas)"
                        - lblL4bCabDataverse:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =Color.White
                              Fill: =nfAzul
                              FillPortions: =1
                              FocusedBorderThickness: =2
                              FontWeight: =FontWeight.Bold
                              PaddingLeft: =12
                              Size: =14
                              Text: =If(scrL4Complemento.Size = ScreenSize.Medium, "Dataverse", "Dataverse · usado nesta ficha")
                        - lblL4bCabSQL:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =nfTexto
                              FillPortions: =1
                              FocusedBorderThickness: =2
                              FontWeight: =FontWeight.Bold
                              PaddingLeft: =12
                              Size: =14
                              Text: ="SQL (Azure SQL)"
                  - conL4bLinha1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.White
                        FillPortions: =0
                        Height: =If(scrL4Complemento.Size = ScreenSize.Small, lblL4bCrit1.Height + lblL4bSp1.Height + lblL4bDv1.Height + lblL4bSql1.Height, Max(lblL4bCrit1.Height, lblL4bSp1.Height, lblL4bDv1.Height, lblL4bSql1.Height))
                        LayoutDirection: =If(scrL4Complemento.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        Visible: =locL4bVista = "tabela"
                      Children:
                        - lblL4bCrit1:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =If(scrL4Complemento.Size = ScreenSize.Small, AlignInContainer.Stretch, AlignInContainer.Start)
                              AutoHeight: =true
                              Color: =nfTexto
                              FocusedBorderThickness: =2
                              FontWeight: =FontWeight.Semibold
                              PaddingBottom: =10
                              PaddingLeft: =16
                              PaddingRight: =12
                              PaddingTop: =10
                              Size: =14
                              Text: ="Estrutura"
                              Width: =If(scrL4Complemento.Size = ScreenSize.Medium, 150, 190)
                        - lblL4bSp1:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =If(scrL4Complemento.Size = ScreenSize.Small, AlignInContainer.Stretch, AlignInContainer.Start)
                              AutoHeight: =true
                              Color: =nfTexto
                              FillPortions: =If(scrL4Complemento.Size = ScreenSize.Small, 0, 1)
                              FocusedBorderThickness: =2
                              PaddingBottom: =10
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =10
                              Text: =If(scrL4Complemento.Size = ScreenSize.Small, "SharePoint · ", "") & "Listas com colunas simples (texto, número, escolha, data, pessoa, pesquisa)."
                        - lblL4bDv1:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =If(scrL4Complemento.Size = ScreenSize.Small, AlignInContainer.Stretch, AlignInContainer.Start)
                              AutoHeight: =true
                              Color: =nfTexto
                              Fill: =nfAzulClaro
                              FillPortions: =If(scrL4Complemento.Size = ScreenSize.Small, 0, 1)
                              FocusedBorderThickness: =2
                              PaddingBottom: =10
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =10
                              Text: =If(scrL4Complemento.Size = ScreenSize.Small, "Dataverse · ", "") & "Tabelas com tipos ricos (moeda, número automático, escolha, pesquisa) e metadados."
                        - lblL4bSql1:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =If(scrL4Complemento.Size = ScreenSize.Small, AlignInContainer.Stretch, AlignInContainer.Start)
                              AutoHeight: =true
                              Color: =nfTexto
                              FillPortions: =If(scrL4Complemento.Size = ScreenSize.Small, 0, 1)
                              FocusedBorderThickness: =2
                              PaddingBottom: =10
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =10
                              Text: =If(scrL4Complemento.Size = ScreenSize.Small, "SQL · ", "") & "Tabelas, tipos e índices definidos em T-SQL por quem desenha a base de dados."
                  - conL4bLinha2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =nfSuperficie
                        FillPortions: =0
                        Height: =If(scrL4Complemento.Size = ScreenSize.Small, lblL4bCrit2.Height + lblL4bSp2.Height + lblL4bDv2.Height + lblL4bSql2.Height, Max(lblL4bCrit2.Height, lblL4bSp2.Height, lblL4bDv2.Height, lblL4bSql2.Height))
                        LayoutDirection: =If(scrL4Complemento.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        Visible: =locL4bVista = "tabela"
                      Children:
                        - lblL4bCrit2:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =If(scrL4Complemento.Size = ScreenSize.Small, AlignInContainer.Stretch, AlignInContainer.Start)
                              AutoHeight: =true
                              Color: =nfTexto
                              FocusedBorderThickness: =2
                              FontWeight: =FontWeight.Semibold
                              PaddingBottom: =10
                              PaddingLeft: =16
                              PaddingRight: =12
                              PaddingTop: =10
                              Size: =14
                              Text: ="Relações"
                              Width: =If(scrL4Complemento.Size = ScreenSize.Medium, 150, 190)
                        - lblL4bSp2:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =If(scrL4Complemento.Size = ScreenSize.Small, AlignInContainer.Stretch, AlignInContainer.Start)
                              AutoHeight: =true
                              Color: =nfTexto
                              FillPortions: =If(scrL4Complemento.Size = ScreenSize.Small, 0, 1)
                              FocusedBorderThickness: =2
                              PaddingBottom: =10
                              PaddingLeft: =12
