Screens:
  scrL4Complemento:
    Properties:
      Fill: =nfFundo
      OnVisible: |-
        =UpdateContext({locL4bVista: "texto"})
    Children:
      - conEcraL4b:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfFundo
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - conCabL4b:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =nfAzul
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - icoInicioL4b:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Voltar ao início"
                        Color: =Color.White
                        Height: =44
                        Icon: =Icon.Home
                        OnSelect: =Navigate(scrInicio, ScreenTransition.UnCover)
                        TabIndex: =0
                        Width: =44
                  - lblCabL4b:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        FillPortions: =1
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Size: =16
                        Text: ="Ficha 04 · Complemento"
            - conConteudoL4b:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutOverflow: =LayoutOverflow.Scroll
                  PaddingBottom: =If(scrL4Complemento.Size = ScreenSize.Small, 16, 24)
                  PaddingLeft: =Max(If(scrL4Complemento.Size = ScreenSize.Small, 16, 24), (Parent.Width - 1000) / 2)
                  PaddingRight: =Max(If(scrL4Complemento.Size = ScreenSize.Small, 16, 24), (Parent.Width - 1000) / 2)
                  PaddingTop: =If(scrL4Complemento.Size = ScreenSize.Small, 16, 24)
                Children:
                  - lblL4bTitulo:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Bold
                        Size: =If(scrL4Complemento.Size = ScreenSize.Small, 20, 24)
                        Text: =If(locL4bVista = "tabela", "Comparação por critério", "SharePoint, Dataverse e SQL")
                  - lblL4bIntro:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTextoSuave
                        FocusedBorderThickness: =2
                        Size: =14
                        Text: |-
                          ="Ponto 8 do Lab 4. A Ficha 04 guarda clientes e pedidos no Dataverse, mas o Power Apps trabalha com outras origens de dados, e escolher uma delas é uma decisão de arquitetura cloud: define o modelo de serviço, quem gere a infraestrutura, até onde a solução escala e quanto custa. Este ecrã apresenta as listas do SharePoint, o Dataverse e o Azure SQL Database, cada um com a sua fundamentação, um aspeto técnico que o distingue e os fatores positivos e menos positivos. No fim, um botão abre a tabela que os compara pelos sete critérios do enunciado e por dois da perspetiva cloud."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpNome:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAzul
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Bold
                        PaddingTop: =12
                        Size: =20
                        Text: ="SharePoint (listas)"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpModelo:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTextoSuave
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        Size: =14
                        Text: ="O modelo SaaS colaborativo"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpOQue:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="As listas do SharePoint são as mesmas da aplicação Microsoft Lists e vivem num site do SharePoint Online, dentro do Microsoft 365. Cada lista é uma tabela de colunas simples, como texto, número, escolha, data, pessoa ou pesquisa, pensada para equipas que precisam de registar e partilhar informação com vistas, formulários e as permissões do próprio site." & Char(10) & Char(10) & "Do ponto de vista da Computação Cloud, o SharePoint Online é software como serviço (SaaS). A Microsoft gere os servidores, as atualizações e a disponibilidade, e a organização limita-se a configurar e a usar as listas. Essa comodidade paga-se em controlo, porque o serviço impõe os mesmos limites a todos os clientes, e é desses limites que depende o que uma app consegue fazer com os dados."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpAprofTit:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAzul
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        PaddingTop: =4
                        Size: =16
                        Text: ="O limiar de vista e a delegação"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpAprof:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="Uma lista pode guardar até 30 milhões de itens, mas uma consulta que percorra mais de 5000 de cada vez esbarra no limiar de vista (List View Threshold). A Microsoft justifica este limite com a necessidade de manter um desempenho consistente para todos os utilizadores nas consultas à base de dados do serviço. Acima dele, só se trabalha com colunas indexadas e com filtros que reduzam o resultado a menos de 5000 itens." & Char(10) & Char(10) & "No Power Apps, este limite cruza-se com a delegação. Quando uma fórmula, como um Filter, pode ser traduzida numa consulta que o SharePoint entende, é o serviço que a executa sobre todos os dados. Quando não pode, a app traz para o dispositivo apenas os primeiros 500 registos, valor que se pode subir até 10 000 nas definições da app, e trabalha só sobre esses, sem que o utilizador perceba o que ficou de fora."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpFavorTit:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfVerdeTexto
                        Fill: =nfVerdeFundo
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        Size: =14
                        Text: ="A favor"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpFavor:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="• Incluído no Microsoft 365. O conector do SharePoint é standard, por isso uma app que só use listas não exige licenças premium do Power Apps." & Char(10) & Char(10) & "• Interface pronta. As listas já têm, no browser, vistas, filtros, formulários e exportação para Excel, o que permite trabalhar com os dados antes de existir qualquer app." & Char(10) & Char(10) & "• Relações simples entre listas. As colunas de pesquisa ligam listas entre si e aceitam eliminação restrita ou em cascata, desde que as listas não passem o limiar de vista." & Char(10) & Char(10) & "• Rapidez e familiaridade. Uma lista monta-se em minutos, e quem já trabalha no Microsoft 365 reconhece de imediato a forma de a usar."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpContraTit:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAmbar
                        Fill: =nfAmbarFundo
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        Size: =14
                        Text: ="Contra"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpContra:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="• Limiar de vista. Uma consulta não processa mais de 5000 itens de cada vez, e acima disso tudo depende de colunas indexadas e de filtros." & Char(10) & Char(10) & "• Delegação parcial. Uma fórmula que o SharePoint não consegue delegar só vê os primeiros 500 registos, ou até 10 000 se se aumentar o limite da app." & Char(10) & Char(10) & "• Relações limitadas. Uma vista aceita no máximo 12 colunas de pesquisa, e a eliminação restrita ou em cascata não se ativa numa lista que já passou o limiar de vista." & Char(10) & Char(10) & "• Modelo de dados simples. Não há regras de negócio aplicadas no servidor nem segurança por coluna, por isso essas proteções ficam a cargo da app ou de fluxos."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSpSintese:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAzul
                        Fill: =nfAzulClaro
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="Em síntese. O SharePoint é uma boa escolha para prototipar depressa e para listas colaborativas de poucos milhares de registos, sem custos de licenciamento adicionais. Os limites que protegem o desempenho do serviço tornam-no, porém, pouco indicado como base de uma aplicação transacional que vá crescer, e é nesse ponto que o Dataverse ou o Azure SQL Database passam a fazer sentido."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvNome:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAzul
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Bold
                        PaddingTop: =12
                        Size: =20
                        Text: ="Dataverse"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvModelo:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTextoSuave
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        Size: =14
                        Text: ="A plataforma de dados da Power Platform"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvOQue:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="O Microsoft Dataverse é uma base de dados relacional gerida pela Microsoft, que existe dentro de um ambiente da Power Platform. Guarda tabelas com tipos de dados ricos, como moeda, número automático, escolha ou pesquisa, e junta-lhes relações, regras de negócio e um modelo de segurança próprio. É a origem de dados das apps baseadas em modelo e foi a escolhida para a Ficha 04." & Char(10) & Char(10) & "Na classificação dos modelos de serviço, o Dataverse comporta-se como uma plataforma gerida (PaaS). A Microsoft gere a infraestrutura e a sua manutenção, e quem desenvolve trabalha apenas com tabelas, relações e regras. Cada ambiente tem a sua própria base de dados, o que permite separar o trabalho de desenvolvimento, de teste e de produção."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvAprofTit:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAzul
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        PaddingTop: =4
                        Size: =16
                        Text: ="Ciclo de vida, segurança e ambientes"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvAprof:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="O Dataverse traz para o desenvolvimento low-code a gestão do ciclo de vida das aplicações (ALM). Tabelas, apps e fluxos agrupam-se em soluções, que se exportam de um ambiente e se importam noutro. A Microsoft recomenda ambientes separados para desenvolvimento e produção, e pelo menos um de teste, com soluções não geridas apenas no ambiente de desenvolvimento e soluções geridas em todos os outros." & Char(10) & Char(10) & "A segurança é também mais fina do que a das listas. O acesso define-se por funções de segurança, que dizem quem pode criar, ler, escrever ou eliminar registos, e organiza-se por unidades de negócio e equipas. Para dados sensíveis, como os protegidos pelo RGPD, os perfis de segurança de coluna escondem colunas específicas a quem não as deve ver, sem ser preciso criar tabelas ou vistas à parte." & Char(10) & Char(10) & "Os metadados das tabelas servem ainda para gerar apps baseadas em modelo, com formulários e vistas responsivos, o que reduz muito o trabalho de construir uma interface de raiz."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvFavorTit:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfVerdeTexto
                        Fill: =nfVerdeFundo
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        Size: =14
                        Text: ="A favor"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvFavor:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="• Relações nativas. As relações de um para muitos e de muitos para muitos pertencem ao próprio serviço, com eliminação restrita, em cascata ou apenas da ligação." & Char(10) & Char(10) & "• Lógica no servidor. Regras de negócio, colunas calculadas e fluxos aplicam-se em todas as apps que usam a tabela, e não apenas numa." & Char(10) & Char(10) & "• Segurança granular. Funções, equipas, unidades de negócio e perfis de segurança de coluna controlam quem vê e quem altera cada registo e cada coluna." & Char(10) & Char(10) & "• Ciclo de vida com soluções. As soluções levam tabelas, apps e fluxos de um ambiente para outro de forma controlada e repetível." & Char(10) & Char(10) & "• Delegação ampla. O Power Apps delega ao Dataverse a maior parte das consultas, e a integração com o Power Automate e o Power BI é direta."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvContraTit:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAmbar
                        Fill: =nfAmbarFundo
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        Size: =14
                        Text: ="Contra"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvContra:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="• Licenciamento premium. O conector do Dataverse é premium, e cada utilizador da app precisa de uma licença Power Apps paga." & Char(10) & Char(10) & "• Custo do armazenamento. A capacidade paga-se por GB. Em pagamento por utilização, cada GB de base de dados acima do incluído custa 48 USD por mês, preço consultado em novembro de 2026." & Char(10) & Char(10) & "• Dependência da plataforma. Os dados e a lógica ficam presos à Power Platform, e a modelação segue regras próprias, que não são as de uma base de dados SQL."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bDvSintese:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAzul
                        Fill: =nfAzulClaro
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="Em síntese. O Dataverse é a escolha natural para aplicações de negócio que precisam de relações, regras e segurança, e foi por isso a origem da Ficha 04. Essa riqueza paga-se em licenças e em capacidade de armazenamento, um custo que convém prever antes de a aplicação ganhar utilizadores e dados."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSqlNome:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAzul
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Bold
                        PaddingTop: =12
                        Size: =20
                        Text: ="SQL (Azure SQL Database)"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSqlModelo:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTextoSuave
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        Size: =14
                        Text: ="O PaaS relacional"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSqlOQue:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="O Azure SQL Database é o motor do SQL Server oferecido como serviço na cloud do Azure. A app liga-se a ele pelo conector SQL Server e trabalha com tabelas, vistas e procedimentos armazenados escritos em T-SQL, o que faz dele a escolha óbvia quando os dados já vivem num servidor SQL ou têm de ser partilhados com outros sistemas." & Char(10) & Char(10) & "É uma plataforma como serviço (PaaS) totalmente gerida. A Microsoft trata das atualizações, das correções, das cópias de segurança e da monitorização, e a organização fica responsável pelo desenho da base de dados, pela segurança dos dados e pelo desempenho das consultas."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSqlAprofTit:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAzul
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        PaddingTop: =4
                        Size: =16
                        Text: ="Computação, armazenamento e lógica no servidor"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSqlAprof:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="No Dataverse, a parte variável do custo é a capacidade de armazenamento. No Azure SQL Database, a computação vende-se à parte. No modelo vCore escolhem-se os núcleos virtuais e a memória, e no modelo DTU compra-se um pacote que junta computação, memória e operações de leitura e escrita. Quando há várias bases de dados com cargas que variam ao longo do dia, um conjunto elástico partilha os mesmos recursos entre elas e reduz o custo total." & Char(10) & Char(10) & "A outra diferença está na lógica. O Power Fx não é uma linguagem de base de dados, e as operações pesadas, como junções grandes ou transações que envolvem várias tabelas, devem ficar em procedimentos armazenados. O Power Apps chama esses procedimentos diretamente a partir de uma fórmula, e o trabalho é feito no servidor, não no dispositivo de quem usa a app."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSqlFavorTit:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfVerdeTexto
                        Fill: =nfVerdeFundo
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        Size: =14
                        Text: ="A favor"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSqlFavor:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTexto
                        Fill: =Color.White
                        FocusedBorderThickness: =2
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Size: =14
                        Text: ="• Modelo relacional completo. Chaves estrangeiras, índices, vistas e procedimentos dão a quem desenha a base de dados controlo total sobre a integridade e o desempenho." & Char(10) & Char(10) & "• Lógica no servidor. Consultas complexas e procedimentos armazenados correm no servidor, e o Power Fx chama-os diretamente." & Char(10) & Char(10) & "• Dados partilhados. Os mesmos dados servem outros sistemas, relatórios e integrações fora da Power Platform." & Char(10) & Char(10) & "• Escala independente. A computação escala à parte do armazenamento, por vCores ou DTU, e os conjuntos elásticos poupam quando há várias bases de dados."
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSqlContraTit:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfAmbar
                        Fill: =nfAmbarFundo
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        Size: =14
                        Text: ="Contra"
                        Visible: =locL4bVista <> "tabela"
                  - lblL4bSqlContra:
                      Control: Label@2.5.1
