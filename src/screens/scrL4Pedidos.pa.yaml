                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Text: =If(locL4Confirmar = "guardar", If(locL4Acao = "criar", "Criar", "Guardar"), "Remover")
                        Width: =130
      - conL4Mensagem:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =If(locL4MsgTipo = "erro", nfVermelhoFundo, nfVerdeFundo)
            Height: =Max(56, lblL4Mensagem.Height + 32)
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Visible: =!IsBlank(locL4Msg)
            Width: =Min(560, Parent.Width - 32)
            X: =(Parent.Width - Self.Width) / 2
            Y: =76
          Children:
            - icoL4MsgIcone:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =If(locL4MsgTipo = "erro", "Erro", "Sucesso")
                  Color: =If(locL4MsgTipo = "erro", nfVermelho, nfVerde)
                  Height: =24
                  Icon: =If(locL4MsgTipo = "erro", Icon.Warning, Icon.Check)
                  Width: =24
            - lblL4Mensagem:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =If(locL4MsgTipo = "erro", nfVermelhoTexto, nfVerdeTexto)
                  FillPortions: =1
                  FocusedBorderThickness: =2
                  FontWeight: =FontWeight.Semibold
                  Text: =locL4Msg
            - icoL4FecharMsg:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Fechar mensagem"
                  Color: =nfTextoSuave
                  Height: =44
                  Icon: =Icon.Cancel
                  OnSelect: |-
                    =UpdateContext({locL4Msg: "", locL4Timer: false})
                  TabIndex: =0
                  Width: =44
      - tmrL4Mensagem:
          Control: Timer@2.1.0
          Properties:
            Duration: =3500
            OnTimerEnd: |-
              =UpdateContext({locL4Msg: "", locL4Timer: false})
            Start: =locL4Timer
            Visible: =false
      - tmrL4cEstado:
          Control: Timer@2.1.0
          Properties:
            Duration: =3000
            OnTimerEnd: |-
              =Refresh(Pedidos);
              UpdateContext({locL4Pedido: LookUp(Pedidos, Pedido = locL4Pedido.Pedido), locL4cTentativas: locL4cTentativas + 1});
              If(
                  locL4Pedido.Processado,
                  UpdateContext({locL4cAguardar: false, locL4MsgTipo: If(locL4Pedido.Tratamento = 'Tratamento (Pedidos)'.Erro, "erro", "ok"), locL4Timer: true,
                      locL4Msg: "Pedido " & locL4Pedido.NumeroPedido & " processado: " & Text(locL4Pedido.Tratamento) & "."}),
                  locL4cTentativas >= 20,
                  UpdateContext({locL4cAguardar: false, locL4MsgTipo: "erro", locL4Timer: false,
                      locL4Msg: "O fluxo ainda não terminou ao fim de 60 s. Use Atualizar estado mais tarde."})
              )
            Repeat: =locL4cAguardar
            Start: =locL4cAguardar
            Visible: =false
