Screens:
  scrL4Pedidos:
    Properties:
      Fill: =nfFundo
      OnVisible: |-
        =UpdateContext({locL4Vista: "todos", locL4Painel: (gblL4Nivel = "revisao" && gblL4dSessao.perfil = "Cliente"), locL4Cliente: If((gblL4Nivel = "revisao" && gblL4dSessao.perfil = "Cliente"), LookUp(Clientes, Cliente = GUID(Coalesce(gblL4dSessao.clienteid, "00000000-0000-0000-0000-000000000000")))), locL4Pedido: Blank(), locL4Modo: "", locL4Acao: "", locL4Confirmar: "", locL4UltimaConf: "", locL4Msg: "", locL4MsgTipo: "", locL4Timer: false, locL4Area: "", locL4cAguardar: false, locL4cTentativas: 0, locL4cValorTeste: "", locL4dUtil: Blank()});
        ResetForm(frmL4Cliente); ResetForm(frmL4Pedido)
    Children:
      - conEcraL4:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfFundo
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - conCabL4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =nfAzul
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =If(scrL4Pedidos.Size = ScreenSize.Small, 8, 12)
                  PaddingLeft: =If(scrL4Pedidos.Size = ScreenSize.Small, 12, 24)
                  PaddingRight: =If(scrL4Pedidos.Size = ScreenSize.Small, 12, 24)
                Children:
                  - icoInicioL4:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Voltar ao início"
                        Color: =Color.White
                        Height: =44
                        Icon: =Icon.Home
                        OnSelect: =Navigate(scrInicio, ScreenTransition.UnCover)
                        TabIndex: =0
                        Width: =44
                  - lblCabL4:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        FillPortions: =1
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Size: =16
                        Text: =If(scrL4Pedidos.Size = ScreenSize.Small && gblL4Nivel = "revisao", "Ficha 04", Switch(gblL4Nivel, "melhoramento", "Ficha 04 · Melhoramento", "revisao", "Ficha 04 · Revisão", "Ficha 04 · Clientes e Pedidos"))
                        Wrap: =false
                  - btnL4dIniciais:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =nfAzul
                        DisabledColor: =Self.Color
                        DisabledFill: =Self.Fill
                        DisplayMode: =DisplayMode.View
                        Fill: =Color.White
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        HoverColor: =Self.Color
                        HoverFill: =Self.Fill
                        PressedFill: =Self.Fill
                        RadiusBottomLeft: =18
                        RadiusBottomRight: =18
                        RadiusTopLeft: =18
                        RadiusTopRight: =18
                        Size: =13
                        TabIndex: =-1
                        Text: |-
                          =With({p: Split(Trim(gblL4dSessao.nome), " ")}, Upper(Left(First(p).Value, 1) & If(CountRows(p) > 1, Left(Last(p).Value, 1), "")))
                        Visible: =gblL4Nivel = "revisao"
                        Width: =36
                  - lblL4dQuem:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        FocusedBorderThickness: =2
                        Height: =44
                        Size: =14
                        Text: =gblL4dSessao.nome
                        Visible: =gblL4Nivel = "revisao" && scrL4Pedidos.Size > ScreenSize.Small
                        Width: =Min(220, Len(Self.Text) * 9 + 8)
                        Wrap: =false
                  - btnL4dPerfil:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =nfAzul
                        DisabledColor: =Self.Color
                        DisabledFill: =Self.Fill
                        DisplayMode: =DisplayMode.View
                        Fill: =nfAzulClaro
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        HoverColor: =Self.Color
                        HoverFill: =Self.Fill
                        PressedFill: =Self.Fill
                        RadiusBottomLeft: =13
                        RadiusBottomRight: =13
                        RadiusTopLeft: =13
                        RadiusTopRight: =13
                        Size: =11
                        TabIndex: =-1
                        Text: =gblL4dSessao.perfil
                        Visible: =gblL4Nivel = "revisao" && scrL4Pedidos.Size > ScreenSize.Small
                        Width: =76
                  - icoL4dUtilizadores:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Gerir os utilizadores"
                        Color: =Color.White
                        Height: =44
                        Icon: =Icon.People
                        OnSelect: |-
                          =UpdateContext({locL4Area: If(locL4Area = "utilizadores", "", "utilizadores"), locL4dUtil: Blank()})
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                        TabIndex: =0
                        Visible: =gblL4Nivel = "revisao" && gblL4dSessao.perfil = "Admin"
                        Width: =44
                  - icoL4dPassword:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Mudar a minha password"
                        Color: =Color.White
                        Height: =44
                        Icon: =Icon.Lock
                        OnSelect: |-
                          =UpdateContext({locL4Area: If(locL4Area = "password", "", "password"), locL4dUtil: Blank()})
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                        TabIndex: =0
                        Visible: =gblL4Nivel = "revisao"
                        Width: =44
                  - btnL4dSair:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =Color.White
                        BorderThickness: =1
                        Color: =Color.White
                        Fill: =Color.Transparent
                        Height: =44
                        HoverColor: =nfAzul
                        HoverFill: =Color.White
                        OnSelect: =Set(gblL4dSessao, Blank()); Navigate(scrL4Entrar, ScreenTransition.UnCover)
                        PressedColor: =nfAzul
                        PressedFill: =Color.White
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Size: =14
                        Text: ="Sair"
                        Visible: =gblL4Nivel = "revisao"
                        Width: =If(scrL4Pedidos.Size = ScreenSize.Small, 64, 80)
            - conConteudoL4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutOverflowY: =If(IsBlank(locL4Area), LayoutOverflow.Hide, LayoutOverflow.Scroll)
                  PaddingBottom: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                  PaddingLeft: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                  PaddingRight: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                  PaddingTop: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                Children:
                  - conL4Barra:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(scrL4Pedidos.Size = ScreenSize.Small, 108, 52)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutWrap: =true
                        Visible: =!(scrL4Pedidos.Size = ScreenSize.Small && locL4Painel) && IsBlank(locL4Area) && !(gblL4Nivel = "revisao" && gblL4dSessao.perfil = "Cliente")
                      Children:
                        - txtL4Pesquisa:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              AccessibleLabel: ="Pesquisar clientes pelo início do nome"
                              Default: =""
                              FillPortions: =1
                              Height: =48
                              HintText: ="Pesquisar cliente pelo início do nome"
                              LayoutMinWidth: =220
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                        - lblL4Contagem:
                            Control: Label@2.5.1
                            Properties:
                              Color: =nfTextoSuave
                              FocusedBorderThickness: =2
                              Height: =48
                              Size: =If(scrL4Pedidos.Size = ScreenSize.Small, 12, 13)
                              Text: |-
                                =With({n: CountRows(Filter(Clientes, StartsWith(Nome, txtL4Pesquisa.Text)))},
                                    If(n = 1, "1 cliente", n & " clientes"))
                              Width: =If(scrL4Pedidos.Size = ScreenSize.Small, 110, 120)
                        - btnL4TodosPedidos:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =nfAzul
                              Color: =If(IsBlank(locL4Cliente) && scrL4Pedidos.Size > ScreenSize.Small, Color.White, nfAzul)
                              DisplayMode: =If(IsBlank(locL4Modo), DisplayMode.Edit, DisplayMode.Disabled)
                              Fill: =If(IsBlank(locL4Cliente) && scrL4Pedidos.Size > ScreenSize.Small, nfAzul, Color.White)
                              Height: =48
                              OnSelect: |-
                                =UpdateContext({locL4Cliente: Blank(), locL4Painel: true})
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Text: ="Todos os pedidos"
                              Width: =If(scrL4Pedidos.Size = ScreenSize.Small, 200, 190)
                  - conL4Corpo:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =24
                        Visible: =IsBlank(locL4Area)
                      Children:
                        - conL4Lista:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.White
                              FillPortions: =If(scrL4Pedidos.Size = ScreenSize.Medium, 1, 2)
                              LayoutDirection: =LayoutDirection.Vertical
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: =scrL4Pedidos.Size > ScreenSize.Small || !locL4Painel
                            Children:
                              - lblL4ListaTitulo:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =nfTextoSuave
                                    FocusedBorderThickness: =2
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    PaddingLeft: =20
                                    Size: =12
                                    Text: ="CLIENTES"
                              - lblL4ListaVazia:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =nfTextoSuave
                                    FocusedBorderThickness: =2
                                    Height: =80
                                    Text: ="Nenhum cliente começa por este texto."
                                    Visible: =IsEmpty(galL4Clientes.AllItems)
                              - galL4Clientes:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    AccessibleLabel: ="Lista de clientes"
                                    DisplayMode: =If(IsBlank(locL4Modo), DisplayMode.Edit, DisplayMode.Disabled)
                                    Items: =If((gblL4Nivel = "revisao" && gblL4dSessao.perfil = "Cliente"), Filter(Clientes, Cliente = GUID(Coalesce(gblL4dSessao.clienteid, "00000000-0000-0000-0000-000000000000"))), Sort(Filter(Clientes, StartsWith(Nome, txtL4Pesquisa.Text)), Nome))
                                    OnSelect: |-
                                      =UpdateContext({locL4Cliente: galL4Clientes.Selected, locL4Painel: true})
                                    TabIndex: =0
                                    TemplateFill: =If(!IsBlank(locL4Cliente) && ThisItem.Cliente = locL4Cliente.Cliente, nfAzulClaro, Color.White)
                                    TemplatePadding: =0
                                    TemplateSize: =72
                                  Children:
                                    - lblL4CliNome:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =nfTexto
                                          FontWeight: =FontWeight.Semibold
                                          Height: =28
                                          OnSelect: =Select(Parent)
                                          Size: =14
                                          Text: =ThisItem.Nome
                                          Width: =Parent.TemplateWidth - 60
                                          Wrap: =false
                                          X: =20
                                          Y: =12
                                    - lblL4CliInfo:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =nfTextoSuave
                                          Height: =22
                                          OnSelect: =Select(Parent)
                                          Size: =12
                                          Text: ="NIF " & ThisItem.NIF & "  ·  " & ThisItem.Telefone
                                          Width: =Parent.TemplateWidth - 60
                                          Wrap: =false
                                          X: =20
                                          Y: =40
                                    - icoL4CliSeta:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          Color: =nfTextoSuave
                                          Height: =24
                                          Icon: =Icon.ChevronRight
                                          OnSelect: =Select(Parent)
                                          Width: =24
                                          X: =Parent.TemplateWidth - 40
                                          Y: =24
                                    - recL4CliSeparador:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =nfLinha
                                          Height: =1
                                          Width: =Parent.TemplateWidth
                                          Y: =Parent.TemplateHeight - 1
                        - conL4Painel:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.White
                              FillPortions: =If(scrL4Pedidos.Size = ScreenSize.Medium, 1, 3)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              PaddingBottom: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                              PaddingLeft: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                              PaddingRight: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                              PaddingTop: =If(scrL4Pedidos.Size = ScreenSize.Small, 16, 24)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: =scrL4Pedidos.Size > ScreenSize.Small || locL4Painel
                            Children:
                              - conL4PainelTopo:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =12
                                  Children:
                                    - btnL4VoltarLista:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          Color: =nfAzul
                                          Fill: =Color.White
                                          Height: =44
                                          OnSelect: |-
                                            =UpdateContext({locL4Painel: false})
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Text: ="‹ Clientes"
                                          Visible: =scrL4Pedidos.Size = ScreenSize.Small && IsBlank(locL4Modo) && !(gblL4Nivel = "revisao" && gblL4dSessao.perfil = "Cliente")
                                          Width: =116
                                    - lblL4PainelTitulo:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =nfTexto
                                          FillPortions: =1
                                          FocusedBorderThickness: =2
                                          FontWeight: =FontWeight.Bold
                                          Height: =44
                                          Size: =If(scrL4Pedidos.Size = ScreenSize.Small, 18, 22)
                                          Text: =Switch(locL4Modo, "cliente", If(locL4Acao = "criar", "Novo cliente", "Editar cliente"), "pedido", If(locL4Acao = "criar", "Novo pedido · " & locL4Cliente.Nome, "Pedido " & locL4Pedido.NumeroPedido), "detalhe", "Pedido " & locL4Pedido.NumeroPedido, If(IsBlank(locL4Cliente), "Todos os clientes", locL4Cliente.Nome))
                                          Wrap: =false
                              - lblL4ClienteDados:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =nfTextoSuave
                                    FocusedBorderThickness: =2
                                    Text: |-
                                      =If(IsBlank(locL4Cliente),
                                          "Pedidos de todos os clientes. Escolha um cliente na lista para ver só os dele.",
                                          "NIF " & locL4Cliente.NIF & "  ·  " & locL4Cliente.Email & "  ·  " & locL4Cliente.Telefone)
                                    Visible: =IsBlank(locL4Modo)
                              - conL4Separadores:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =48
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Visible: =IsBlank(locL4Modo)
                                  Children:
                                    - btnL4SepTodos:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          Color: =If(locL4Vista = "todos", Color.White, nfAzul)
                                          Fill: =If(locL4Vista = "todos", nfAzul, Color.White)
                                          FillPortions: =1
                                          Height: =48
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =UpdateContext({locL4Vista: "todos"})
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Size: =Switch(scrL4Pedidos.Size, ScreenSize.Small, 11, ScreenSize.Medium, 11, 13)
                                          Text: ="Todos (" & If(IsBlank(locL4Cliente), CountRows(Filter(Pedidos, Estado = 'Estado (Pedidos)'.Ativo)), CountRows(Filter(Pedidos, Estado = 'Estado (Pedidos)'.Ativo && Clientes.Cliente = locL4Cliente.Cliente))) & ")"
                                          Width: =150
                                    - btnL4SepPendentes:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          Color: =If(locL4Vista = "pendentes", Color.White, nfAzul)
                                          Fill: =If(locL4Vista = "pendentes", nfAzul, Color.White)
                                          FillPortions: =1
                                          Height: =48
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =UpdateContext({locL4Vista: "pendentes"})
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Size: =Switch(scrL4Pedidos.Size, ScreenSize.Small, 11, ScreenSize.Medium, 11, 13)
                                          Text: =If(scrL4Pedidos.Size >= ScreenSize.ExtraLarge, "Pedidos Pendentes (", "Pendentes (") & If(IsBlank(locL4Cliente), CountRows(Filter(Pedidos, EstadoPedido = 'EstadoPedido (Pedidos)'.Pendente)), CountRows(Filter(Pedidos, EstadoPedido = 'EstadoPedido (Pedidos)'.Pendente && Clientes.Cliente = locL4Cliente.Cliente))) & ")"
                                          Width: =220
                                    - btnL4SepConcluidos:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          Color: =If(locL4Vista = "concluidos", Color.White, nfAzul)
                                          Fill: =If(locL4Vista = "concluidos", nfAzul, Color.White)
                                          FillPortions: =1
                                          Height: =48
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =UpdateContext({locL4Vista: "concluidos"})
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Size: =Switch(scrL4Pedidos.Size, ScreenSize.Small, 11, ScreenSize.Medium, 11, 13)
                                          Text: =If(scrL4Pedidos.Size >= ScreenSize.ExtraLarge, "Pedidos Concluídos (", "Concluídos (") & If(IsBlank(locL4Cliente), CountRows(Filter(Pedidos, EstadoPedido = 'EstadoPedido (Pedidos)'.Concluído)), CountRows(Filter(Pedidos, EstadoPedido = 'EstadoPedido (Pedidos)'.Concluído && Clientes.Cliente = locL4Cliente.Cliente))) & ")"
                                          Width: =230
                              - conL4cSeparadores:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =44
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Visible: =(gblL4Nivel = "melhoramento" || gblL4Nivel = "revisao") && IsBlank(locL4Modo)
                                  Children:
                                    - btnL4cSepAuto:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          Color: =If(locL4Vista = "auto", Color.White, nfAzul)
                                          Fill: =If(locL4Vista = "auto", nfAzul, Color.White)
                                          FillPortions: =1
                                          Height: =44
                                          HoverColor: =If(locL4Vista = "auto", Color.White, nfAzul)
                                          HoverFill: =If(locL4Vista = "auto", nfAzul, nfAzulClaro)
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =UpdateContext({locL4Vista: "auto"})
                                          PressedColor: =If(locL4Vista = "auto", Color.White, nfAzul)
                                          PressedFill: =If(locL4Vista = "auto", nfAzul, nfAzulClaro)
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Size: =Switch(scrL4Pedidos.Size, ScreenSize.Small, 11, ScreenSize.Medium, 11, 13)
                                          Text: ="Automático (" & If(IsBlank(locL4Cliente), CountRows(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Automático)), CountRows(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Automático, Clientes.Cliente = locL4Cliente.Cliente))) & ")"
                                          Width: =150
                                    - btnL4cSepRevisao:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          Color: =If(locL4Vista = "revisao", Color.White, nfAzul)
                                          Fill: =If(locL4Vista = "revisao", nfAzul, Color.White)
                                          FillPortions: =1
                                          Height: =44
                                          HoverColor: =If(locL4Vista = "revisao", Color.White, nfAzul)
                                          HoverFill: =If(locL4Vista = "revisao", nfAzul, nfAzulClaro)
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =UpdateContext({locL4Vista: "revisao"})
                                          PressedColor: =If(locL4Vista = "revisao", Color.White, nfAzul)
                                          PressedFill: =If(locL4Vista = "revisao", nfAzul, nfAzulClaro)
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Size: =Switch(scrL4Pedidos.Size, ScreenSize.Small, 11, ScreenSize.Medium, 11, 13)
                                          Text: =If(gblL4Nivel = "revisao", "Por decidir (" & If(IsBlank(locL4Cliente), CountRows(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão, Decisao <> 'Decisao (Pedidos)'.Aprovado, Decisao <> 'Decisao (Pedidos)'.Rejeitado)), CountRows(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão, Decisao <> 'Decisao (Pedidos)'.Aprovado, Decisao <> 'Decisao (Pedidos)'.Rejeitado, Clientes.Cliente = locL4Cliente.Cliente))) & ")", "Revisão (" & If(IsBlank(locL4Cliente), CountRows(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão)), CountRows(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão, Clientes.Cliente = locL4Cliente.Cliente))) & ")")
                                          Width: =150
                                    - btnL4cSepErro:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          Color: =If(locL4Vista = "erro", Color.White, nfAzul)
                                          Fill: =If(locL4Vista = "erro", nfAzul, Color.White)
                                          FillPortions: =1
                                          Height: =44
