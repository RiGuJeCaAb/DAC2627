                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =If(locMsgTipo = "erro", "Erro", "Sucesso")
                  Color: =If(locMsgTipo = "erro", nfVermelho, nfVerde)
                  Height: =24
                  Icon: =If(locMsgTipo = "erro", Icon.Warning, Icon.Check)
                  TabIndex: =-1
                  Width: =24
            - lblL2Mensagem:
                Control: Label@2.5.1
                Properties:
                  Color: =If(locMsgTipo = "erro", ColorValue("#8E1F25"), ColorValue("#1F5E43"))
                  FillPortions: =1
                  FocusedBorderThickness: =2
                  FontWeight: =FontWeight.Semibold
                  TabIndex: =-1
                  Text: =locMsg
            - icoL2FecharMsg:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Fechar mensagem"
                  Color: =nfTextoSuave
                  Height: =44
                  Icon: =Icon.Cancel
                  OnSelect: |-
                    =UpdateContext({locMsg: "", locTimer: false})
                  TabIndex: =0
                  Width: =44
      - tmrL2Mensagem:
          Control: Timer@2.1.0
          Properties:
            Duration: =3500
            OnTimerEnd: |-
              =UpdateContext({locMsg: "", locTimer: false})
            Start: =locTimer
            Visible: =false
