Screens:
  scrL2Servicos:
    Properties:
      Fill: =nfFundo
      OnVisible: |-
        =UpdateContext({locSel: Blank(), locTentou: false, locAcao: "", locUltimaAcao: "",
                       locMsg: "", locMsgTipo: "ok", locTimer: false});
        ViewForm(frmL2Servico)
    Children:
      - conEcraL2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =nfFundo
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - conCabL2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =nfAzul
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - icoInicioL2:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Voltar ao início"
                        Color: =Color.White
                        Height: =44
                        Icon: =Icon.Home
                        OnSelect: =Navigate(scrInicio, ScreenTransition.UnCover)
                        TabIndex: =0
                        Width: =44
                  - lblCabL2:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        FillPortions: =1
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Size: =16
                        TabIndex: =-1
                        Text: ="Ficha 02 · Serviços Cloud"
            - conConteudoL2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                Children:
                  - conL2Barra:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(scrL2Servicos.Size = ScreenSize.Small, 168, 52)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutWrap: =true
                        Visible: =!(scrL2Servicos.Size = ScreenSize.Small && (!IsBlank(locSel) || frmL2Servico.Mode <> FormMode.View))
                      Children:
                        - txtL2Pesquisa:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              AccessibleLabel: ="Pesquisar serviços pelo início do nome"
                              Default: =""
                              DisplayMode: =If(frmL2Servico.Mode = FormMode.View, DisplayMode.Edit, DisplayMode.Disabled)
                              FillPortions: =1
                              Height: =48
                              HintText: ="Pesquisar pelo início do nome"
                              LayoutMinWidth: =220
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                        - drpL2Modelo:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              AccessibleLabel: ="Filtrar por modelo de serviço"
                              Default: ="Todos"
                              DisplayMode: =If(frmL2Servico.Mode = FormMode.View, DisplayMode.Edit, DisplayMode.Disabled)
                              Height: =48
                              Items: =["Todos", "IaaS", "PaaS", "SaaS"]
                              Items.Value: =Value
                              Width: =160
                        - lblL2Contagem:
                            Control: Label@2.5.1
                            Properties:
                              Color: =nfTextoSuave
                              FocusedBorderThickness: =2
                              Height: =48
                              TabIndex: =-1
                              Text: |-
                                =With({n: If(drpL2Modelo.Selected.Value = "Todos", CountRows(Filter('Cloud Service', StartsWith('Service Title', txtL2Pesquisa.Text))), CountRows(Filter('Cloud Service', StartsWith('Service Title', txtL2Pesquisa.Text) && 'Service Model' = LookUp(Choices('Cloud Service'.'Service Model'), Text(Value) = drpL2Modelo.Selected.Value).Value)))}, If(n = 1, "1 serviço", n & " serviços"))
                              Width: =110
                        - btnL2Novo:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Color: =Color.White
                              DisplayMode: =If(frmL2Servico.Mode = FormMode.View, DisplayMode.Edit, DisplayMode.Disabled)
                              Fill: =nfAzul
                              Height: =48
                              OnSelect: |-
                                =NewForm(frmL2Servico);
                                    UpdateContext({locTentou: false, locMsg: "", locTimer: false})
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Text: ="+  Novo serviço"
                              Width: =180
                  - conL2Corpo:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =24
                      Children:
                        - conL2Lista:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Light
                              Fill: =Color.White
                              FillPortions: =If(scrL2Servicos.Size = ScreenSize.Medium, 1, 2)
                              LayoutDirection: =LayoutDirection.Vertical
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: |-
                                =scrL2Servicos.Size > ScreenSize.Small ||
                                    (IsBlank(locSel) && frmL2Servico.Mode = FormMode.View)
                            Children:
                              - lblL2Vazio:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =nfTextoSuave
                                    FocusedBorderThickness: =2
                                    Height: =80
                                    TabIndex: =-1
                                    Text: ="Nenhum serviço encontrado com estes critérios."
                                    Visible: =IsEmpty(galL2Servicos.AllItems)
                              - galL2Servicos:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    AccessibleLabel: ="Lista de serviços cloud"
                                    DisplayMode: =If(frmL2Servico.Mode = FormMode.View, DisplayMode.Edit, DisplayMode.Disabled)
                                    Items: =If(drpL2Modelo.Selected.Value = "Todos", Sort(Filter('Cloud Service', StartsWith('Service Title', txtL2Pesquisa.Text)), 'Service Title'), Sort(Filter('Cloud Service', StartsWith('Service Title', txtL2Pesquisa.Text) && 'Service Model' = LookUp(Choices('Cloud Service'.'Service Model'), Text(Value) = drpL2Modelo.Selected.Value).Value), 'Service Title'))
                                    OnSelect: |-
                                      =UpdateContext({locSel: galL2Servicos.Selected, locTentou: false})
                                    TabIndex: =0
                                    TemplateFill: =If(ThisItem.'Cloud Service' = locSel.'Cloud Service', nfAzulClaro, Color.White)
                                    TemplatePadding: =0
                                    TemplateSize: =72
                                  Children:
                                    - lblL2ItemTitulo:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =nfTexto
                                          FontWeight: =FontWeight.Semibold
                                          Height: =28
                                          OnSelect: =Select(Parent)
                                          Size: =14
                                          Text: =ThisItem.'Service Title'
                                          Width: =Parent.TemplateWidth - 120
                                          Wrap: =false
                                          X: =20
                                          Y: =12
                                    - lblL2ItemFornecedor:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =nfTextoSuave
                                          Height: =22
                                          OnSelect: =Select(Parent)
                                          Size: =12
                                          Text: =ThisItem.Provider
                                          Width: =Parent.TemplateWidth - 120
                                          X: =20
                                          Y: =40
                                    - btnL2ItemModelo:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderThickness: =0
                                          Color: |-
                                            =Switch(Text(ThisItem.'Service Model'),
                                                "IaaS", nfAzul, "PaaS", ColorValue("#1F5E43"), ColorValue("#8A3B0F"))
                                          DisabledColor: =Self.Color
                                          DisabledFill: =Self.Fill
                                          Fill: |-
                                            =Switch(Text(ThisItem.'Service Model'),
                                                "IaaS", ColorValue("#DCE7F2"), "PaaS", nfVerdeFundo, ColorValue("#FBEBD9"))
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =28
                                          HoverColor: =Self.Color
                                          HoverFill: =Self.Fill
                                          OnSelect: =Select(Parent)
                                          PressedFill: =Self.Fill
                                          RadiusBottomLeft: =14
                                          RadiusBottomRight: =14
                                          RadiusTopLeft: =14
                                          RadiusTopRight: =14
                                          Size: =11
                                          TabIndex: =-1
                                          Text: =Text(ThisItem.'Service Model')
                                          Width: =64
                                          X: =Parent.TemplateWidth - 90
                                          Y: =22
                                    - recL2Separador:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          AccessibleLabel: =""
                                          Fill: =nfLinha
                                          Height: =1
                                          TabIndex: =-1
                                          Width: =Parent.TemplateWidth
                                          Y: =Parent.TemplateHeight - 1
                        - conL2Painel:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Light
                              Fill: =Color.White
                              FillPortions: =If(scrL2Servicos.Size = ScreenSize.Medium, 1, 3)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =24
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Visible: |-
                                =scrL2Servicos.Size > ScreenSize.Small ||
                                    !IsBlank(locSel) || frmL2Servico.Mode <> FormMode.View
                            Children:
                              - conL2PainelTopo:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =12
                                  Children:
                                    - btnL2VoltarLista:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          Color: =nfAzul
                                          Fill: =Color.White
                                          Height: =44
                                          OnSelect: |-
                                            =UpdateContext({locSel: Blank()})
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Text: ="‹ Lista"
                                          Visible: =scrL2Servicos.Size = ScreenSize.Small && frmL2Servico.Mode = FormMode.View
                                          Width: =96
                                    - lblL2PainelTitulo:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =nfTexto
                                          FillPortions: =1
                                          FocusedBorderThickness: =2
                                          FontWeight: =FontWeight.Bold
                                          Height: =44
                                          Size: =If(scrL2Servicos.Size = ScreenSize.Small, 18, 22)
                                          TabIndex: =-1
                                          Text: |-
                                            =If(frmL2Servico.Mode = FormMode.New, "Novo serviço",
                                               frmL2Servico.Mode = FormMode.Edit, "Editar serviço",
                                               locSel.'Service Title')
                                          Wrap: =false
                              - conL2ErroGeral:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =nfVermelhoFundo
                                    FillPortions: =0
                                    Height: =44
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Visible: |-
                                      =locTentou && (IsBlank(Trim(txtL2Titulo.Text)) ||
                                          IsBlank(Trim(txtL2Fornecedor.Text)) || IsBlank(cmbL2Modelo.Selected))
                                  Children:
                                    - lblL2ErroGeral:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =ColorValue("#8E1F25")
                                          FillPortions: =1
                                          FocusedBorderThickness: =2
                                          FontWeight: =FontWeight.Semibold
                                          TabIndex: =-1
                                          Text: ="Preencha os campos obrigatórios assinalados."
                              - frmL2Servico:
                                  Control: Form@2.4.4
                                  Variant: Classic
                                  Layout: Vertical
                                  Properties:
                                    BorderColor: =nfBorda
                                    DataSource: ='Cloud Service'
                                    DefaultMode: =FormMode.View
                                    Item: =locSel
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    NumberOfColumns: =2
                                    OnFailure: |-
                                      =UpdateContext({locMsg: "Não foi possível guardar. " & frmL2Servico.Error, locMsgTipo: "erro"})
                                    OnSuccess: |-
                                      =UpdateContext({locSel: frmL2Servico.LastSubmit, locTentou: false, locMsgTipo: "ok", locTimer: true, locMsg: If(locUltimaAcao = "criar", "Serviço " & frmL2Servico.LastSubmit.'Service Title' & " criado.", "Alterações a " & frmL2Servico.LastSubmit.'Service Title' & " guardadas.")}); ViewForm(frmL2Servico)
                                    Visible: =Self.Mode <> FormMode.View || !IsBlank(locSel)
                                  Children:
                                    - Service Title_DataCard1:
                                        Control: TypedDataCard@1.0.7
                                        Variant: ClassicTextualEdit
                                        Properties:
                                          BorderColor: =nfBorda
                                          DataField: ="mcsft_servicetitle"
                                          Default: =ThisItem.'Service Title'
                                          DisplayName: =DataSourceInfo([@'Cloud Service'],DataSourceInfo.DisplayName,mcsft_servicetitle)
                                          MaxLength: =DataSourceInfo([@'Cloud Service'], DataSourceInfo.MaxLength, mcsft_servicetitle)
                                          Required: =false
                                          Update: =Trim(txtL2Titulo.Text)
                                          Width: =364
                                          X: =0
                                          Y: =0
                                        Children:
                                          - DataCardKey2:
                                              Control: Label@2.5.1
                                              MetadataKey: FieldName
                                              Properties:
                                                AutoHeight: =true
                                                BorderColor: =nfBorda
                                                Color: =nfTexto
                                                Font: =Font.'Open Sans'
                                                Height: =34
                                                Text: =Parent.DisplayName
                                                Width: =Parent.Width - 60
                                                Wrap: =false
                                                X: =30
                                                Y: =10
                                          - txtL2Titulo:
                                              Control: Classic/TextInput@2.3.2
                                              MetadataKey: FieldValue
                                              Properties:
                                                AccessibleLabel: =Parent.DisplayName
                                                BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, nfVermelho)
                                                Default: =Parent.Default
                                                DelayOutput: =true
                                                DisplayMode: =Parent.DisplayMode
                                                Font: =Font.'Open Sans'
                                                HintText: |-
                                                  ="Ex.: Azure VM"
                                                HoverBorderColor: =nfAzul
                                                HoverFill: =nfAzulFundo
                                                MaxLength: =Parent.MaxLength
                                                PaddingLeft: =5
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Tooltip: =Parent.DisplayName
                                                Width: =Parent.Width - 60
                                                X: =30
                                                Y: =DataCardKey2.Y + DataCardKey2.Height + 5
                                          - ErrorMessage2:
                                              Control: Label@2.5.1
                                              MetadataKey: ErrorMessage
                                              Properties:
                                                AutoHeight: =true
                                                BorderColor: =nfBorda
                                                Color: =nfVermelhoTexto
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =10
                                                Live: =Live.Assertive
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =14
                                                Text: ="Indique o nome do serviço."
                                                Visible: =locTentou && IsBlank(Trim(txtL2Titulo.Text))
                                                Width: =Parent.Width - 60
                                                X: =30
                                                Y: =txtL2Titulo.Y + txtL2Titulo.Height
                                          - StarVisible2:
                                              Control: Label@2.5.1
                                              MetadataKey: FieldRequired
                                              Properties:
                                                Align: =Align.Center
                                                BorderColor: =nfBorda
                                                Color: =nfTexto
                                                Font: =Font.'Open Sans'
                                                Height: =DataCardKey2.Height
                                                Text: ="*"
                                                Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =30
                                                Wrap: =false
                                                Y: =DataCardKey2.Y
                                    - Status_DataCard1:
                                        Control: TypedDataCard@1.0.7
                                        Variant: ClassicComboBoxOptionSetSingleEdit
                                        IsLocked: true
                                        Properties:
                                          BorderColor: =nfBorda
                                          DataField: ="mcsft_status"
                                          Default: =ThisItem.Status
                                          DisplayName: =DataSourceInfo([@'Cloud Service'],DataSourceInfo.DisplayName,mcsft_status)
                                          Required: =false
                                          Update: =cmbL2Estado.Selected.Value
                                          Width: =364
                                          X: =1
                                          Y: =0
                                        Children:
                                          - DataCardKey5:
                                              Control: Label@2.5.1
                                              MetadataKey: FieldName
                                              Properties:
                                                AutoHeight: =true
                                                BorderColor: =nfBorda
                                                Color: =nfTexto
                                                Font: =Font.'Open Sans'
                                                Height: =34
                                                Text: =Parent.DisplayName
                                                Width: =Parent.Width - 60
                                                Wrap: =false
                                                X: =30
                                                Y: =10
                                          - cmbL2Estado:
                                              Control: Classic/ComboBox@2.4.0
                                              MetadataKey: FieldValue
                                              Properties:
                                                AccessibleLabel: =Parent.DisplayName
                                                BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, nfVermelho)
                                                ChevronBackground: =nfAzul
                                                ChevronFill: =Color.White
                                                ChevronHoverBackground: =ColorFade(nfAzul, -20%)
                                                ChevronHoverFill: =Color.White
                                                DefaultSelectedItems: =[Parent.Default]
                                                DisplayMode: =Parent.DisplayMode
                                                Font: =Font.'Open Sans'
                                                HoverFill: =nfAzulFundo
                                                IsSearchable: =false
                                                Items: =Choices('Status (Cloud Service)')
                                                PaddingLeft: =If(Self.DisplayMode = DisplayMode.Edit, 5, 0)
                                                PressedColor: =Color.White
                                                PressedFill: =nfAzul
                                                SelectMultiple: =false
                                                SelectionColor: =Color.White
                                                SelectionFill: =nfAzul
                                                Tooltip: =Parent.DisplayName
                                                Width: =Parent.Width - 60
                                                X: =30
                                                Y: =DataCardKey5.Y + DataCardKey5.Height + 5
                                          - ErrorMessage5:
                                              Control: Label@2.5.1
                                              MetadataKey: ErrorMessage
                                              Properties:
                                                AutoHeight: =true
                                                BorderColor: =nfBorda
                                                Color: =nfVermelhoTexto
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =10
                                                Live: =Live.Assertive
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =14
                                                Text: =Parent.Error
                                                Visible: =Parent.DisplayMode=DisplayMode.Edit
                                                Width: =Parent.Width - 60
                                                X: =30
                                                Y: =cmbL2Estado.Y + cmbL2Estado.Height
                                          - StarVisible5:
                                              Control: Label@2.5.1
                                              MetadataKey: FieldRequired
                                              Properties:
                                                Align: =Align.Center
                                                BorderColor: =nfBorda
                                                Color: =nfTexto
                                                Font: =Font.'Open Sans'
                                                Height: =DataCardKey5.Height
                                                Text: ="*"
                                                Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =30
                                                Wrap: =false
                                                Y: =DataCardKey5.Y
                                    - Provider_DataCard1:
                                        Control: TypedDataCard@1.0.7
                                        Variant: ClassicTextualEdit
                                        Properties:
                                          BorderColor: =nfBorda
                                          DataField: ="mcsft_provider"
                                          Default: =ThisItem.Provider
                                          DisplayName: =DataSourceInfo([@'Cloud Service'],DataSourceInfo.DisplayName,mcsft_provider)
                                          MaxLength: =DataSourceInfo([@'Cloud Service'], DataSourceInfo.MaxLength, mcsft_provider)
                                          Required: =false
                                          Update: =Trim(txtL2Fornecedor.Text)
                                          Width: =364
                                          X: =0
                                          Y: =1
                                        Children:
                                          - DataCardKey1:
                                              Control: Label@2.5.1
                                              MetadataKey: FieldName
                                              Properties:
                                                AutoHeight: =true
                                                BorderColor: =nfBorda
                                                Color: =nfTexto
                                                Font: =Font.'Open Sans'
                                                Height: =34
                                                Text: =Parent.DisplayName
                                                Width: =Parent.Width - 60
                                                Wrap: =false
                                                X: =30
                                                Y: =10
                                          - txtL2Fornecedor:
                                              Control: Classic/TextInput@2.3.2
                                              MetadataKey: FieldValue
                                              Properties:
                                                AccessibleLabel: =Parent.DisplayName
                                                BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, nfVermelho)
                                                Default: =Parent.Default
                                                DelayOutput: =true
                                                DisplayMode: =Parent.DisplayMode
                                                Font: =Font.'Open Sans'
                                                HintText: |-
                                                  ="Ex.: Microsoft"
                                                HoverBorderColor: =nfAzul
                                                HoverFill: =nfAzulFundo
                                                MaxLength: =Parent.MaxLength
                                                PaddingLeft: =5
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Tooltip: =Parent.DisplayName
                                                Width: =Parent.Width - 60
                                                X: =30
                                                Y: =DataCardKey1.Y + DataCardKey1.Height + 5
                                          - ErrorMessage1:
                                              Control: Label@2.5.1
                                              MetadataKey: ErrorMessage
                                              Properties:
                                                AutoHeight: =true
                                                BorderColor: =nfBorda
                                                Color: =nfVermelhoTexto
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =10
                                                Live: =Live.Assertive
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =14
                                                Text: ="Indique o fornecedor."
                                                Visible: =locTentou && IsBlank(Trim(txtL2Fornecedor.Text))
                                                Width: =Parent.Width - 60
                                                X: =30
                                                Y: =txtL2Fornecedor.Y + txtL2Fornecedor.Height
                                          - StarVisible1:
                                              Control: Label@2.5.1
                                              MetadataKey: FieldRequired
                                              Properties:
                                                Align: =Align.Center
                                                BorderColor: =nfBorda
                                                Color: =nfTexto
                                                Font: =Font.'Open Sans'
                                                Height: =DataCardKey1.Height
                                                Text: ="*"
                                                Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =30
                                                Wrap: =false
                                                Y: =DataCardKey1.Y
                                    - Service Model_DataCard1:
                                        Control: TypedDataCard@1.0.7
                                        Variant: ClassicComboBoxOptionSetSingleEdit
                                        Properties:
                                          BorderColor: =nfBorda
                                          DataField: ="mcsft_servicemodel"
                                          Default: =ThisItem.'Service Model'
                                          DisplayName: =DataSourceInfo([@'Cloud Service'],DataSourceInfo.DisplayName,mcsft_servicemodel)
                                          Required: =false
                                          Update: =cmbL2Modelo.Selected.Value
                                          Width: =364
                                          X: =1
                                          Y: =1
                                        Children:
                                          - DataCardKey4:
                                              Control: Label@2.5.1
                                              MetadataKey: FieldName
                                              Properties:
                                                AutoHeight: =true
                                                BorderColor: =nfBorda
                                                Color: =nfTexto
                                                Font: =Font.'Open Sans'
                                                Height: =34
                                                Text: =Parent.DisplayName
                                                Width: =Parent.Width - 60
                                                Wrap: =false
                                                X: =30
                                                Y: =10
                                          - cmbL2Modelo:
                                              Control: Classic/ComboBox@2.4.0
                                              MetadataKey: FieldValue
                                              Properties:
                                                AccessibleLabel: =Parent.DisplayName
                                                BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, nfVermelho)
                                                ChevronBackground: =nfAzul
                                                ChevronFill: =Color.White
                                                ChevronHoverBackground: =ColorFade(nfAzul, -20%)
                                                ChevronHoverFill: =Color.White
                                                DefaultSelectedItems: =[Parent.Default]
                                                DisplayFields: =["Value"]
                                                DisplayMode: =Parent.DisplayMode
