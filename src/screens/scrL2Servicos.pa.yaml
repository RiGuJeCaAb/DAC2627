            Height: =Parent.Height
            TabIndex: =-1
            Visible: =locAcao <> ""
            Width: =Parent.Width
      - conL2Dialogo:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Bold
            Fill: =Color.White
            Height: =240
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            PaddingBottom: =28
            PaddingLeft: =28
            PaddingRight: =28
            PaddingTop: =28
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            RadiusTopLeft: =16
            RadiusTopRight: =16
            Visible: =locAcao <> ""
            Width: =Min(480, Parent.Width - 32)
            X: =(Parent.Width - Self.Width) / 2
            Y: =(Parent.Height - Self.Height) / 2
          Children:
            - lblL2ConfTitulo:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =nfTexto
                  FocusedBorderThickness: =2
                  FontWeight: =FontWeight.Bold
                  Size: =22
                  TabIndex: =-1
                  Text: |-
                    =Switch(locAcao,
                        "criar", "Criar serviço?",
                        "editar", "Guardar alterações?",
                        "Remover serviço?")
            - lblL2ConfTexto:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =nfTextoSuave
                  FillPortions: =1
                  FocusedBorderThickness: =2
                  TabIndex: =-1
                  Text: |-
                    =Switch(locAcao,
                        "criar", "O serviço " & Trim(txtL2Titulo.Text) & " vai ser acrescentado à tabela Cloud Service.",
                        "editar", "As alterações a " & locSel.'Service Title' & " vão ser gravadas na tabela Cloud Service.",
                        "O serviço " & locSel.'Service Title' & " vai ser removido da tabela Cloud Service. Esta ação não pode ser anulada.")
                  VerticalAlign: =VerticalAlign.Top
            - conL2ConfBotoes:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =48
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.End
                Children:
                  - btnL2ConfCancelar:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =nfAzul
                        Color: =nfAzul
                        Fill: =Color.White
                        Height: =48
                        OnSelect: |-
                          =UpdateContext({locAcao: ""})
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Text: ="Cancelar"
                        Width: =130
                  - btnL2ConfOk:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =Color.White
                        Fill: =If(locAcao = "remover", nfVermelho, nfAzul)
                        Height: =48
                        OnSelect: |-
                          =UpdateContext({locUltimaAcao: locAcao, locAcao: ""});
                          If(
                              locUltimaAcao = "remover",
                              IfError(
                                  Remove('Cloud Service', locSel),
                                  UpdateContext({locMsg: "Não foi possível remover o serviço.", locMsgTipo: "erro"}),
                                  UpdateContext({locMsg: "Serviço " & locSel.'Service Title' & " removido.", locMsgTipo: "ok", locTimer: true});
                                  UpdateContext({locSel: Blank()})
                              ),
                              SubmitForm(frmL2Servico)
                          )
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Text: =Switch(locAcao, "criar", "Criar", "editar", "Guardar", "Remover")
                        Width: =130
      - conL2Mensagem:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =If(locMsgTipo = "erro", nfVermelhoFundo, nfVerdeFundo)
            Height: =56
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Visible: =locMsg <> ""
            Width: =Min(520, Parent.Width - 32)
            X: =(Parent.Width - Self.Width) / 2
            Y: =76
          Children:
