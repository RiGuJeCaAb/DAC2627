Screens:
  scrL1Pedido:
    Properties:
      Fill: =nfFundo
      OnVisible: |-
        =Reset(txtL1Nome); UpdateContext({locAviso: false})
    Children:
      - conEcraL1b:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfFundo
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - conCabL1b:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =nfAzul
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - icoInicioL1b:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Voltar ao início"
                        Color: =Color.White
                        Height: =44
                        Icon: =Icon.Home
                        OnSelect: =Navigate(scrInicio, ScreenTransition.UnCover)
                        TabIndex: =0
                        Width: =44
                  - icoL1Voltar:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Voltar"
                        Color: =Color.White
                        Height: =44
                        Icon: =Icon.ChevronLeft
                        OnSelect: =Back()
                        TabIndex: =0
                        Width: =44
                  - lblCabL1b:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        FillPortions: =1
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Size: =16
                        TabIndex: =-1
                        Text: ="Ficha 01 · Passo 1 de 2"
            - conConteudoL1b:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  PaddingBottom: =If(scrL1Pedido.Size = ScreenSize.Small, 16, 24)
                  PaddingLeft: =If(scrL1Pedido.Size = ScreenSize.Small, 16, 24)
                  PaddingRight: =If(scrL1Pedido.Size = ScreenSize.Small, 16, 24)
                  PaddingTop: =If(scrL1Pedido.Size = ScreenSize.Small, 16, 24)
                Children:
                  - conL1bCartao:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Light
                        Fill: =Color.White
                        FillPortions: =0
                        Height: =If(scrL1Pedido.Size = ScreenSize.Small, 400, 400)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =20
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        PaddingBottom: =If(scrL1Pedido.Size = ScreenSize.Small, 24, 40)
                        PaddingLeft: =If(scrL1Pedido.Size = ScreenSize.Small, 24, 40)
                        PaddingRight: =If(scrL1Pedido.Size = ScreenSize.Small, 24, 40)
                        PaddingTop: =If(scrL1Pedido.Size = ScreenSize.Small, 24, 40)
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Width: =Min(640, Parent.Width - If(scrL1Pedido.Size = ScreenSize.Small, 32, 48))
                      Children:
                        - lblL1Pergunta:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =nfTexto
                              FocusedBorderThickness: =2
                              FontWeight: =FontWeight.Bold
                              Size: =If(scrL1Pedido.Size = ScreenSize.Small, 24, 28)
                              TabIndex: =-1
                              Text: ="Como se chama?"
                        - txtL1Nome:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              AccessibleLabel: ="O seu nome"
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =nfBorda
                              Default: =gblL1Nome
                              Height: =52
                              HintText: ="Indique o seu nome"
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                        - conL1Aviso:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =nfAmbarFundo
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              PaddingLeft: =16
                              PaddingRight: =16
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Visible: =locAviso && IsBlank(Trim(txtL1Nome.Text))
                            Children:
                              - lblL1Aviso:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =nfAmbar
                                    FillPortions: =1
                                    FocusedBorderThickness: =2
                                    FontWeight: =FontWeight.Semibold
                                    TabIndex: =-1
                                    Text: ="Introduza o seu nome."
                        - btnL1Saudar:
                            Control: Classic/Button@2.2.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =Color.White
                              Fill: =nfAzul
                              Height: =52
                              OnSelect: |-
                                =If(
                                    IsBlank(Trim(txtL1Nome.Text)),
                                    UpdateContext({locAviso: true}),
                                    Set(gblL1Nome, Trim(txtL1Nome.Text)); Navigate(scrL1Saudacao, ScreenTransition.Fade)
                                )
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Text: ="Saudar"
