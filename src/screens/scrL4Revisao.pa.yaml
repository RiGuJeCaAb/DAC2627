Screens:
  scrL4Revisao:
    Properties:
      Fill: =nfFundo
      OnVisible: |-
        =UpdateContext({locL4dVista: "revisao", locL4dFiltro: "pordecidir", locL4dPedido: Blank(), locL4dUtil: Blank(), locL4dMsg: "", locL4dMsgTipo: "", locL4dTimer: false});
        Refresh(Pedidos)
    Children:
      - conEcraL4dR:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfFundo
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - conCabL4dR:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =nfAzul
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - icoInicioL4dR:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Voltar ao início"
                        Color: =Color.White
                        Height: =44
                        Icon: =Icon.Home
                        OnSelect: =Navigate(scrInicio, ScreenTransition.UnCover)
                        TabIndex: =0
                        Width: =44
                  - lblCabL4dR:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        FillPortions: =1
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Size: =16
                        Text: ="Ficha 04 · Revisão"
                  - btnL4dIniciais:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =nfAzul
                        DisabledColor: =Self.Color
                        DisabledFill: =Self.Fill
                        DisplayMode: =DisplayMode.View
                        Fill: =Color.White
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        HoverColor: =Self.Color
                        HoverFill: =Self.Fill
                        PressedFill: =Self.Fill
                        RadiusBottomLeft: =18
                        RadiusBottomRight: =18
                        RadiusTopLeft: =18
                        RadiusTopRight: =18
                        Size: =13
                        TabIndex: =-1
                        Text: |-
                          =With({p: Split(Trim(gblL4dSessao.nome), " ")}, Upper(Left(First(p).Value, 1) & If(CountRows(p) > 1, Left(Last(p).Value, 1), "")))
                        Width: =36
                  - lblL4dQuem:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        FocusedBorderThickness: =2
                        Height: =44
                        Size: =14
                        Text: =gblL4dSessao.nome
                        Visible: =scrL4Revisao.Size > ScreenSize.Small
                        Width: =Min(220, Len(Self.Text) * 9 + 8)
                        Wrap: =false
                  - btnL4dPerfil:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =nfAzul
                        DisabledColor: =Self.Color
                        DisabledFill: =Self.Fill
                        DisplayMode: =DisplayMode.View
                        Fill: =nfAzulClaro
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        HoverColor: =Self.Color
                        HoverFill: =Self.Fill
                        PressedFill: =Self.Fill
                        RadiusBottomLeft: =13
                        RadiusBottomRight: =13
                        RadiusTopLeft: =13
                        RadiusTopRight: =13
                        Size: =11
                        TabIndex: =-1
                        Text: =gblL4dSessao.perfil
                        Width: =76
                  - btnL4dSair:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =Color.White
                        BorderThickness: =1
                        Color: =Color.White
                        Fill: =Color.Transparent
                        Height: =44
                        HoverColor: =nfAzul
                        HoverFill: =Color.White
                        OnSelect: =Set(gblL4dSessao, Blank()); Navigate(scrL4Entrar, ScreenTransition.UnCover)
                        PressedColor: =nfAzul
                        PressedFill: =Color.White
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Size: =14
                        Text: ="Sair"
                        Width: =80
            - conCorpoL4dR:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =If(scrL4Revisao.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                Children:
                  - conL4dMenu:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        DropShadow: =DropShadow.None
                        Fill: =Color.White
                        FillPortions: =0
                        Height: =If(scrL4Revisao.Size = ScreenSize.Small, 60, Parent.Height)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        PaddingBottom: =If(scrL4Revisao.Size = ScreenSize.Small, 0, 16)
                        PaddingLeft: =If(scrL4Revisao.Size = ScreenSize.Small, 0, 12)
                        PaddingRight: =If(scrL4Revisao.Size = ScreenSize.Small, 0, 12)
                        PaddingTop: =If(scrL4Revisao.Size = ScreenSize.Small, 0, 16)
                        Width: =If(scrL4Revisao.Size = ScreenSize.Small, Parent.Width, If(scrL4Revisao.Size = ScreenSize.Medium, 220, 260))
                      Children:
                        - galL4dMenu:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Menu da revisão"
                              AlignInContainer: =AlignInContainer.Stretch
                              FillPortions: =0
                              Height: =Self.AllItemsCount * Self.TemplateHeight
                              Items: |-
                                =Filter(
                                    Table(
                                        {Chave: "revisao", Texto: "Pedidos em revisão", Icone: Icon.DocumentWithContent, Contagem: With({c: GUID(Coalesce(gblL4dSessao.clienteid, "00000000-0000-0000-0000-000000000000"))}, If(gblL4dSessao.perfil = "Cliente", CountRows(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão, ThisRecord.Clientes.Cliente = c, Decisao <> 'Decisao (Pedidos)'.Aprovado, Decisao <> 'Decisao (Pedidos)'.Rejeitado)), CountRows(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão, Decisao <> 'Decisao (Pedidos)'.Aprovado, Decisao <> 'Decisao (Pedidos)'.Rejeitado)))), Visivel: true},
                                        {Chave: "registar", Texto: "Novo pedido", Icone: Icon.Add, Contagem: 0, Visivel: true},
                                        {Chave: "utilizadores", Texto: "Utilizadores", Icone: Icon.People, Contagem: 0, Visivel: gblL4dSessao.perfil = "Admin"},
                                        {Chave: "password", Texto: "A minha password", Icone: Icon.Lock, Contagem: 0, Visivel: true}
                                    ),
                                    Visivel
                                )
                              LayoutMinHeight: =0
                              OnSelect: |-
                                =If(ThisItem.Chave = "ficha04", Navigate(scrL4Pedidos, ScreenTransition.Cover), UpdateContext({locL4dVista: ThisItem.Chave, locL4dPedido: Blank(), locL4dUtil: Blank()}))
                              TabIndex: =0
                              TemplateFill: =If(ThisItem.Chave = locL4dVista, nfAzulClaro, Color.White)
                              TemplatePadding: =0
                              TemplateSize: =48
                              Visible: =!(scrL4Revisao.Size = ScreenSize.Small)
                            Children:
                              - recL4dMSel:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =nfAzul
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                                    Visible: =ThisItem.Chave = locL4dVista
                                    Width: =4
                              - icoL4dMIcone:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Color: =If(ThisItem.Chave = locL4dVista, nfAzul, nfTextoSuave)
                                    Height: =20
                                    Icon: =ThisItem.Icone
                                    OnSelect: =Select(Parent)
                                    Width: =20
                                    X: =20
                                    Y: =14
                              - lblL4dMTexto:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =If(ThisItem.Chave = locL4dVista, nfAzul, nfTexto)
                                    FontWeight: =If(ThisItem.Chave = locL4dVista, FontWeight.Semibold, FontWeight.Normal)
                                    Height: =48
                                    OnSelect: =Select(Parent)
                                    Size: =14
                                    Text: =ThisItem.Texto
                                    Width: =Parent.TemplateWidth - 100
                                    Wrap: =false
                                    X: =52
                              - lblL4dMContagem:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    Color: =nfAzul
                                    FontWeight: =FontWeight.Bold
                                    Height: =48
                                    OnSelect: =Select(Parent)
                                    Text: =If(ThisItem.Contagem > 0, Text(ThisItem.Contagem), "")
                                    Width: =36
                                    X: =Parent.TemplateWidth - Self.Width - 12
                        - galL4dMenuCompacto:
                            Control: Gallery@2.15.0
                            Variant: Horizontal
                            Properties:
                              AccessibleLabel: ="Menu da revisão"
                              AlignInContainer: =AlignInContainer.Stretch
                              FillPortions: =0
                              Height: =60
                              Items: |-
                                =Filter(
                                    Table(
                                        {Chave: "revisao", Texto: "Revisão", Icone: Icon.DocumentWithContent, Contagem: With({c: GUID(Coalesce(gblL4dSessao.clienteid, "00000000-0000-0000-0000-000000000000"))}, If(gblL4dSessao.perfil = "Cliente", CountRows(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão, ThisRecord.Clientes.Cliente = c, Decisao <> 'Decisao (Pedidos)'.Aprovado, Decisao <> 'Decisao (Pedidos)'.Rejeitado)), CountRows(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão, Decisao <> 'Decisao (Pedidos)'.Aprovado, Decisao <> 'Decisao (Pedidos)'.Rejeitado)))), Visivel: true},
                                        {Chave: "registar", Texto: "Novo", Icone: Icon.Add, Contagem: 0, Visivel: true},
                                        {Chave: "utilizadores", Texto: "Utilizadores", Icone: Icon.People, Contagem: 0, Visivel: gblL4dSessao.perfil = "Admin"},
                                        {Chave: "password", Texto: "Password", Icone: Icon.Lock, Contagem: 0, Visivel: true},
                                        {Chave: "ficha04", Texto: "Ficha 04", Icone: Icon.ChevronRight, Contagem: 0, Visivel: gblL4dSessao.perfil <> "Cliente"}
                                    ),
                                    Visivel
                                )
                              OnSelect: |-
                                =If(ThisItem.Chave = "ficha04", Navigate(scrL4Pedidos, ScreenTransition.Cover), UpdateContext({locL4dVista: ThisItem.Chave, locL4dPedido: Blank(), locL4dUtil: Blank()}))
                              TabIndex: =0
                              TemplatePadding: =0
                              TemplateSize: =Self.Width / Max(1, Self.AllItemsCount)
                              Visible: =scrL4Revisao.Size = ScreenSize.Small
                            Children:
                              - icoL4dMCIcone:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Color: =If(ThisItem.Chave = locL4dVista, nfAzul, nfTextoSuave)
                                    Height: =22
                                    Icon: =ThisItem.Icone
                                    OnSelect: =Select(Parent)
                                    Width: =22
                                    X: =(Parent.TemplateWidth - Self.Width) / 2
                                    Y: =8
                              - lblL4dMCTexto:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =If(ThisItem.Chave = locL4dVista, nfAzul, nfTextoSuave)
                                    FontWeight: =If(ThisItem.Chave = locL4dVista, FontWeight.Semibold, FontWeight.Normal)
                                    Height: =22
                                    OnSelect: =Select(Parent)
                                    Size: =11
                                    Text: =ThisItem.Texto
                                    Width: =Parent.TemplateWidth
                                    Wrap: =false
                                    Y: =32
                              - recL4dMCSel:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =nfAzul
                                    Height: =3
                                    OnSelect: =Select(Parent)
                                    Visible: =ThisItem.Chave = locL4dVista
                                    Width: =Parent.TemplateWidth
                                    Y: =Parent.TemplateHeight - 3
                        - conL4dMenuLinha:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =nfLinha
                              FillPortions: =0
                              Height: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              Visible: =btnL4dFicha04.Visible
                        - btnL4dFicha04:
                            Control: Classic/Button@2.2.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =nfAzul
                              BorderThickness: =1
                              Color: =nfAzul
                              Fill: =Color.White
                              Height: =44
                              HoverColor: =nfAzul
                              HoverFill: =nfAzulClaro
                              OnSelect: =Navigate(scrL4Pedidos, ScreenTransition.Cover)
                              PressedColor: =nfAzul
                              PressedFill: =nfAzulClaro
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =13
                              Text: ="Ficha 04 · Clientes e pedidos"
                              Visible: =gblL4dSessao.perfil <> "Cliente" && !(scrL4Revisao.Size = ScreenSize.Small)
                  - conConteudoL4dR:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =If(scrL4Revisao.Size = ScreenSize.Small, 16, 32)
                        PaddingLeft: =If(scrL4Revisao.Size = ScreenSize.Small, 16, 32)
                        PaddingRight: =Max(If(scrL4Revisao.Size = ScreenSize.Small, 16, 32), Parent.Width - conL4dMenu.Width - 1200)
                        PaddingTop: =If(scrL4Revisao.Size = ScreenSize.Small, 16, 24)
                      Children:
                        - conL4dTopo:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(scrL4Revisao.Size = ScreenSize.Small && locL4dVista = "revisao", 44 + 12 + 44, 44)
                              LayoutDirection: =If(scrL4Revisao.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutGap: =12
                            Children:
                              - lblL4dVistaTitulo:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    AutoHeight: =false
                                    Color: =nfTexto
                                    FillPortions: =1
                                    FocusedBorderThickness: =2
                                    FontWeight: =FontWeight.Bold
                                    Height: =44
                                    Size: =If(scrL4Revisao.Size = ScreenSize.Small, 18, 22)
                                    Text: =Switch(locL4dVista, "registar", "Novo pedido", "utilizadores", "Utilizadores", "password", "A minha password", "Pedidos em revisão")
                                    Wrap: =false
                              - conL4dSegmentos:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =44
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    Visible: =locL4dVista = "revisao"
                                    Width: =If(scrL4Revisao.Size = ScreenSize.Small, Parent.Width, 320)
                                  Children:
                                    - btnL4dFiltroPorDecidir:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          BorderThickness: =1
                                          Color: =If(locL4dFiltro = "pordecidir", Color.White, nfAzul)
                                          Fill: =If(locL4dFiltro = "pordecidir", nfAzul, Color.White)
                                          FillPortions: =If(scrL4Revisao.Size = ScreenSize.Small, 1, 0)
                                          Height: =44
                                          HoverColor: =If(locL4dFiltro = "pordecidir", Color.White, nfAzul)
                                          HoverFill: =If(locL4dFiltro = "pordecidir", nfAzul, nfAzulClaro)
                                          OnSelect: |-
                                            =UpdateContext({locL4dFiltro: "pordecidir", locL4dPedido: Blank()})
                                          PressedColor: =If(locL4dFiltro = "pordecidir", Color.White, nfAzul)
                                          PressedFill: =If(locL4dFiltro = "pordecidir", nfAzul, nfAzulClaro)
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =0
                                          Size: =14
                                          Text: |-
                                            ="Por decidir  ·  " & With({c: GUID(Coalesce(gblL4dSessao.clienteid, "00000000-0000-0000-0000-000000000000"))}, If(gblL4dSessao.perfil = "Cliente", CountRows(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão, ThisRecord.Clientes.Cliente = c, Decisao <> 'Decisao (Pedidos)'.Aprovado, Decisao <> 'Decisao (Pedidos)'.Rejeitado)), CountRows(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão, Decisao <> 'Decisao (Pedidos)'.Aprovado, Decisao <> 'Decisao (Pedidos)'.Rejeitado))))
                                          Width: =160
                                    - btnL4dFiltroDecididos:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          BorderThickness: =1
                                          Color: =If(locL4dFiltro = "decididos", Color.White, nfAzul)
                                          Fill: =If(locL4dFiltro = "decididos", nfAzul, Color.White)
                                          FillPortions: =If(scrL4Revisao.Size = ScreenSize.Small, 1, 0)
                                          Height: =44
                                          HoverColor: =If(locL4dFiltro = "decididos", Color.White, nfAzul)
                                          HoverFill: =If(locL4dFiltro = "decididos", nfAzul, nfAzulClaro)
                                          OnSelect: |-
                                            =UpdateContext({locL4dFiltro: "decididos", locL4dPedido: Blank()})
                                          PressedColor: =If(locL4dFiltro = "decididos", Color.White, nfAzul)
                                          PressedFill: =If(locL4dFiltro = "decididos", nfAzul, nfAzulClaro)
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =12
                                          Size: =14
                                          Text: |-
                                            ="Decididos  ·  " & With({c: GUID(Coalesce(gblL4dSessao.clienteid, "00000000-0000-0000-0000-000000000000"))}, If(gblL4dSessao.perfil = "Cliente", CountRows(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão, ThisRecord.Clientes.Cliente = c, (Decisao = 'Decisao (Pedidos)'.Aprovado || Decisao = 'Decisao (Pedidos)'.Rejeitado))), CountRows(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão, (Decisao = 'Decisao (Pedidos)'.Aprovado || Decisao = 'Decisao (Pedidos)'.Rejeitado)))))
                                          Width: =160
                        - conL4dVistaRevisao:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(scrL4Revisao.Size = ScreenSize.Small, conL4dListaCartao.Height + conL4dDetalhe.Height + 16, Max(conL4dListaCartao.Height, conL4dDetalhe.Height)) + 2
                              LayoutDirection: =If(scrL4Revisao.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutGap: =16
                              PaddingBottom: =2
                              Visible: =locL4dVista = "revisao"
                            Children:
                              - conL4dListaCartao:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderColor: =nfLinha
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.White
                                    FillPortions: =If(scrL4Revisao.Size = ScreenSize.Small, 0, 4)
                                    Height: =If(lblL4dListaVazia.Visible, lblL4dListaVazia.Height, galL4dPedidos.Height) + 2
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMinWidth: =300
                                    PaddingBottom: =1
                                    PaddingLeft: =1
                                    PaddingRight: =1
                                    PaddingTop: =1
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                  Children:
                                    - galL4dPedidos:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: ="Pedidos em revisão"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          FillPortions: =0
                                          Height: =Self.AllItemsCount * Self.TemplateHeight
                                          Items: |-
                                            =With({c: GUID(Coalesce(gblL4dSessao.clienteid, "00000000-0000-0000-0000-000000000000"))},
                                                If(gblL4dSessao.perfil = "Cliente",
                                                    If(locL4dFiltro = "decididos", Sort(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão, ThisRecord.Clientes.Cliente = c, (Decisao = 'Decisao (Pedidos)'.Aprovado || Decisao = 'Decisao (Pedidos)'.Rejeitado)), DataProcessamento, SortOrder.Descending),
                                                        Sort(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão, ThisRecord.Clientes.Cliente = c, Decisao <> 'Decisao (Pedidos)'.Aprovado, Decisao <> 'Decisao (Pedidos)'.Rejeitado), DataProcessamento, SortOrder.Descending)),
                                                    If(locL4dFiltro = "decididos", Sort(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão, (Decisao = 'Decisao (Pedidos)'.Aprovado || Decisao = 'Decisao (Pedidos)'.Rejeitado)), DataProcessamento, SortOrder.Descending),
                                                        Sort(Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão, Decisao <> 'Decisao (Pedidos)'.Aprovado, Decisao <> 'Decisao (Pedidos)'.Rejeitado), DataProcessamento, SortOrder.Descending))
                                                )
                                            )
                                          LayoutMinHeight: =0
                                          OnSelect: |-
                                            =UpdateContext({locL4dPedido: ThisItem}); Reset(txtL4dComentario)
                                          TabIndex: =0
                                          TemplateFill: =If(ThisItem.Pedido = locL4dPedido.Pedido, nfAzulClaro, Color.White)
                                          TemplatePadding: =0
                                          TemplateSize: =74
                                          Visible: =Self.AllItemsCount > 0
                                        Children:
                                          - recL4dGEstado:
                                              Control: Rectangle@2.3.0
                                              Properties:
                                                Fill: |-
                                                  =If(ThisItem.Decisao = 'Decisao (Pedidos)'.Aprovado, nfVerdeTexto, ThisItem.Decisao = 'Decisao (Pedidos)'.Rejeitado, nfVermelhoTexto, ThisItem.Decisao = 'Decisao (Pedidos)'.'Proposta: aprovar' || ThisItem.Decisao = 'Decisao (Pedidos)'.'Proposta: rejeitar', nfAzul, nfAmbar)
                                                Height: =Parent.TemplateHeight
                                                OnSelect: =Select(Parent)
                                                Width: =4
                                          - lblL4dGNumero:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =nfTexto
                                                FontWeight: =FontWeight.Semibold
                                                Height: =26
                                                OnSelect: =Select(Parent)
                                                Size: =14
                                                Text: =ThisItem.NumeroPedido
                                                Width: =Parent.TemplateWidth - 180
                                                Wrap: =false
                                                X: =20
                                                Y: =10
                                          - lblL4dGCliente:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =nfTextoSuave
                                                Height: =24
                                                OnSelect: =Select(Parent)
                                                Text: =ThisItem.Clientes.Nome & "  ·  " & Text(ThisItem.DataPedido, "dd/mm/yyyy")
                                                Width: =Parent.TemplateWidth - 180
                                                Wrap: =false
                                                X: =20
                                                Y: =38
                                          - lblL4dGValor:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Right
                                                Color: =nfTexto
                                                FontWeight: =FontWeight.Semibold
                                                Height: =26
