                              Height: =44
                              HoverColor: =If(locL4cFiltro = "todos", Color.White, nfAzul)
                              HoverFill: =If(locL4cFiltro = "todos", nfAzul, nfAzulClaro)
                              OnSelect: |-
                                =UpdateContext({locL4cFiltro: "todos"})
                              PressedColor: =If(locL4cFiltro = "todos", Color.White, nfAzul)
                              PressedFill: =If(locL4cFiltro = "todos", nfAzul, nfAzulClaro)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =14
                              Text: ="Todos"
                              Width: =130
                        - btnL4cFiltroAuto:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =nfAzul
                              Color: =If(locL4cFiltro = "auto", Color.White, nfAzul)
                              Fill: =If(locL4cFiltro = "auto", nfAzul, Color.White)
                              Height: =44
                              HoverColor: =If(locL4cFiltro = "auto", Color.White, nfAzul)
                              HoverFill: =If(locL4cFiltro = "auto", nfAzul, nfAzulClaro)
                              OnSelect: |-
                                =UpdateContext({locL4cFiltro: "auto"})
                              PressedColor: =If(locL4cFiltro = "auto", Color.White, nfAzul)
                              PressedFill: =If(locL4cFiltro = "auto", nfAzul, nfAzulClaro)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =14
                              Text: ="Automático"
                              Width: =130
                        - btnL4cFiltroRevisao:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =nfAzul
                              Color: =If(locL4cFiltro = "revisao", Color.White, nfAzul)
                              Fill: =If(locL4cFiltro = "revisao", nfAzul, Color.White)
                              Height: =44
                              HoverColor: =If(locL4cFiltro = "revisao", Color.White, nfAzul)
                              HoverFill: =If(locL4cFiltro = "revisao", nfAzul, nfAzulClaro)
                              OnSelect: |-
                                =UpdateContext({locL4cFiltro: "revisao"})
                              PressedColor: =If(locL4cFiltro = "revisao", Color.White, nfAzul)
                              PressedFill: =If(locL4cFiltro = "revisao", nfAzul, nfAzulClaro)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =14
                              Text: ="Revisão"
                              Width: =130
                        - btnL4cFiltroErro:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =nfAzul
                              Color: =If(locL4cFiltro = "erro", Color.White, nfAzul)
                              Fill: =If(locL4cFiltro = "erro", nfAzul, Color.White)
                              Height: =44
                              HoverColor: =If(locL4cFiltro = "erro", Color.White, nfAzul)
                              HoverFill: =If(locL4cFiltro = "erro", nfAzul, nfAzulClaro)
                              OnSelect: |-
                                =UpdateContext({locL4cFiltro: "erro"})
                              PressedColor: =If(locL4cFiltro = "erro", Color.White, nfAzul)
                              PressedFill: =If(locL4cFiltro = "erro", nfAzul, nfAzulClaro)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =14
                              Text: ="Erro"
                              Width: =130
                  - lblL4cListaVazia:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfTextoSuave
                        FocusedBorderThickness: =2
                        Size: =14
                        Text: ="Não há pedidos processados com este tratamento."
                        Visible: =galL4cPedidos.AllItemsCount = 0
                  - conL4cListaCartao:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =nfLinha
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =Color.White
                        FillPortions: =0
                        Height: =galL4cPedidos.Height + 2
                        LayoutDirection: =LayoutDirection.Vertical
                        PaddingBottom: =1
                        PaddingLeft: =1
                        PaddingRight: =1
                        PaddingTop: =1
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - galL4cPedidos:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Pedidos processados"
                              AlignInContainer: =AlignInContainer.Stretch
                              FillPortions: =0
                              Height: =Max(1, Self.AllItemsCount) * Self.TemplateHeight
                              Items: |-
                                =FirstN(Sort(Switch(locL4cFiltro,
                                    "auto", Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Automático),
                                    "revisao", Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Revisão),
                                    "erro", Filter(Pedidos, Tratamento = 'Tratamento (Pedidos)'.Erro),
                                    Filter(Pedidos, Processado = true)
                                ), DataProcessamento, SortOrder.Descending), 25)
                              LayoutMinHeight: =0
                              OnSelect: |-
                                =UpdateContext({locL4cPedido: ThisItem, locL4cAguardar: false})
                              TabIndex: =0
                              TemplatePadding: =0
                              TemplateSize: =70
                            Children:
                              - lblL4cGNumero:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =nfTexto
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    OnSelect: =Select(Parent)
                                    Size: =14
                                    Text: =ThisItem.NumeroPedido & "  ·  " & ThisItem.Clientes.Nome
                                    Width: =Parent.TemplateWidth - If(scrL4Melhoramento.Size = ScreenSize.Small, 160, 300)
                                    Wrap: =false
                                    X: =16
                                    Y: =8
                              - lblL4cGObs:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =nfTextoSuave
                                    Height: =24
                                    OnSelect: =Select(Parent)
                                    Size: =12
                                    Text: =Coalesce(ThisItem.ObservacoesProcessamento, "")
                                    Width: =Parent.TemplateWidth - 32
                                    Wrap: =false
                                    X: =16
                                    Y: =38
                              - lblL4cGValor:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    Color: =nfTexto
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    OnSelect: =Select(Parent)
                                    Size: =14
                                    Text: =If(IsBlank(ThisItem.Valor), "—", Text(ThisItem.Valor, "[$-pt-PT]0,00") & " €")
                                    Visible: =scrL4Melhoramento.Size > ScreenSize.Small
                                    Width: =130
                                    X: =Parent.TemplateWidth - 284
                                    Y: =8
                              - btnL4cGTratamento:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =If(IsBlank(ThisItem.Tratamento), nfTextoSuave, ThisItem.Tratamento = 'Tratamento (Pedidos)'.'Por processar', nfAzul, ThisItem.Tratamento = 'Tratamento (Pedidos)'.Automático, nfVerdeTexto, ThisItem.Tratamento = 'Tratamento (Pedidos)'.Revisão, nfAmbar, nfVermelhoTexto)
                                    DisabledColor: =Self.Color
                                    DisabledFill: =Self.Fill
                                    DisplayMode: =DisplayMode.View
                                    Fill: =If(IsBlank(ThisItem.Tratamento), nfLinha, ThisItem.Tratamento = 'Tratamento (Pedidos)'.'Por processar', nfAzulFundo, ThisItem.Tratamento = 'Tratamento (Pedidos)'.Automático, nfVerdeFundo, ThisItem.Tratamento = 'Tratamento (Pedidos)'.Revisão, nfAmbarFundo, nfVermelhoFundo)
                                    FontWeight: =FontWeight.Bold
                                    Height: =26
                                    HoverColor: =Self.Color
                                    HoverFill: =Self.Fill
                                    OnSelect: =Select(Parent)
                                    PressedFill: =Self.Fill
                                    RadiusBottomLeft: =13
                                    RadiusBottomRight: =13
                                    RadiusTopLeft: =13
                                    RadiusTopRight: =13
                                    Size: =11
                                    TabIndex: =-1
                                    Text: =If(IsBlank(ThisItem.Tratamento), "Não processado", Text(ThisItem.Tratamento))
                                    Width: =128
                                    X: =Parent.TemplateWidth - Self.Width - 16
                                    Y: =9
                              - recL4cGSeparador:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =nfLinha
                                    Height: =1
                                    Width: =Parent.TemplateWidth
                                    Y: =Parent.TemplateHeight - 1
      - conL4cMensagem:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =If(locL4cMsgTipo = "erro", nfVermelhoFundo, nfVerdeFundo)
            Height: =56
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Visible: =!IsBlank(locL4cMsg)
            Width: =Min(560, Parent.Width - 32)
            X: =(Parent.Width - Self.Width) / 2
            Y: =76
          Children:
            - icoL4cMsgIcone:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =If(locL4cMsgTipo = "erro", "Erro", "Sucesso")
                  Color: =If(locL4cMsgTipo = "erro", nfVermelho, nfVerde)
                  Height: =24
                  Icon: =If(locL4cMsgTipo = "erro", Icon.Warning, Icon.Check)
                  Width: =24
            - lblL4cMensagem:
                Control: Label@2.5.1
                Properties:
                  Color: =If(locL4cMsgTipo = "erro", nfVermelhoTexto, nfVerdeTexto)
                  FillPortions: =1
                  FocusedBorderThickness: =2
                  FontWeight: =FontWeight.Semibold
                  Text: =locL4cMsg
            - icoL4cFecharMsg:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Fechar mensagem"
                  Color: =nfTextoSuave
                  Height: =44
                  Icon: =Icon.Cancel
                  OnSelect: |-
                    =UpdateContext({locL4cMsg: "", locL4cTimer: false})
                  TabIndex: =0
                  Width: =44
      - tmrL4cMensagem:
          Control: Timer@2.1.0
          Properties:
            Duration: =4000
            OnTimerEnd: |-
              =UpdateContext({locL4cMsg: "", locL4cTimer: false})
            Start: =locL4cTimer
            Visible: =false
      - tmrL4cEstado:
          Control: Timer@2.1.0
          Properties:
            Duration: =3000
            OnTimerEnd: |-
              =Refresh(Pedidos);
              UpdateContext({locL4cPedido: LookUp(Pedidos, Pedido = locL4cPedido.Pedido), locL4cTentativas: locL4cTentativas + 1});
              If(
                  locL4cPedido.Processado,
                  UpdateContext({locL4cAguardar: false, locL4cMsgTipo: If(locL4cPedido.Tratamento = 'Tratamento (Pedidos)'.Erro, "erro", "ok"), locL4cTimer: true,
                      locL4cMsg: "Pedido " & locL4cPedido.NumeroPedido & " processado: " & Text(locL4cPedido.Tratamento) & "."}),
                  locL4cTentativas >= 20,
                  UpdateContext({locL4cAguardar: false, locL4cMsgTipo: "erro", locL4cTimer: false,
                      locL4cMsg: "O fluxo ainda não terminou ao fim de 60 s. Use Atualizar estado mais tarde."})
              )
            Repeat: =locL4cAguardar
            Start: =locL4cAguardar
            Visible: =false
