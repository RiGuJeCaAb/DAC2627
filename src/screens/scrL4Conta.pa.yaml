Screens:
  scrL4Conta:
    Properties:
      Fill: =nfFundo
      OnVisible: |-
        =UpdateContext({locL4dUtil: Blank(), locL4dMsg: "", locL4dMsgTipo: "", locL4dTimer: false});
        Reset(txtL4dPassAtual); Reset(txtL4dPassNova); Reset(txtL4dPassConfirma)
    Children:
      - conEcraL4dC:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfFundo
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - conCabL4dC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =nfAzul
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - icoInicioL4dC:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Voltar ao início"
                        Color: =Color.White
                        Height: =44
                        Icon: =Icon.Home
                        OnSelect: =Navigate(scrInicio, ScreenTransition.UnCover)
                        TabIndex: =0
                        Width: =44
                  - lblCabL4dC:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        FillPortions: =1
                        FocusedBorderThickness: =2
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Size: =16
                        Text: ="Ficha 04 · Revisão"
                  - icoL4dCUtilizadores:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Gerir os utilizadores"
                        Color: =Color.White
                        Height: =44
                        Icon: =Icon.People
                        OnSelect: |-
                          =Set(gblL4dArea, "utilizadores"); UpdateContext({locL4dUtil: Blank(), locL4dMsg: "", locL4dTimer: false})
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                        TabIndex: =0
                        Visible: =gblL4dSessao.perfil = "Admin"
                        Width: =44
                  - icoL4dCPassword:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Mudar a minha password"
                        Color: =Color.White
                        Height: =44
                        Icon: =Icon.Lock
                        OnSelect: |-
                          =Set(gblL4dArea, "password"); UpdateContext({locL4dUtil: Blank(), locL4dMsg: "", locL4dTimer: false})
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                        TabIndex: =0
                        Width: =44
            - conConteudoL4dC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =If(scrL4Conta.Size = ScreenSize.Small, 16, 24)
                  PaddingLeft: =Max(If(scrL4Conta.Size = ScreenSize.Small, 16, 24), (Parent.Width - 1100) / 2)
                  PaddingRight: =Max(If(scrL4Conta.Size = ScreenSize.Small, 16, 24), (Parent.Width - 1100) / 2)
                  PaddingTop: =If(scrL4Conta.Size = ScreenSize.Small, 16, 24)
                Children:
                  - conL4dAreaTopo:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                      Children:
                        - lblL4dAreaTitulo:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              AutoHeight: =false
                              Color: =nfTexto
                              FillPortions: =1
                              FocusedBorderThickness: =2
                              FontWeight: =FontWeight.Bold
                              Height: =44
                              Size: =If(scrL4Conta.Size = ScreenSize.Small, 18, 22)
                              Text: =If(gblL4dArea = "utilizadores", "Utilizadores", "A minha password")
                              Wrap: =false
                        - btnL4dAreaVoltar:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =nfAzul
                              BorderThickness: =1
                              Color: =nfAzul
                              Fill: =Color.White
                              Height: =44
                              HoverColor: =nfAzul
                              HoverFill: =nfAzulClaro
                              OnSelect: =Navigate(scrL4Pedidos, ScreenTransition.UnCover)
                              PressedColor: =nfAzul
                              PressedFill: =nfAzulClaro
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =14
                              Text: ="‹ Pedidos"
                              Width: =130
                  - conL4dVistaUtilizadores:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(scrL4Conta.Size = ScreenSize.Small, conL4dUtilLista.Height + conL4dUtilForm.Height + 16, Max(conL4dUtilLista.Height, conL4dUtilForm.Height)) + 2
                        LayoutDirection: =If(scrL4Conta.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =16
                        PaddingBottom: =2
                        Visible: =gblL4Nivel = "revisao" && gblL4dArea = "utilizadores" && gblL4dSessao.perfil = "Admin"
                      Children:
                        - conL4dUtilLista:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =If(scrL4Conta.Size = ScreenSize.Small, AlignInContainer.Stretch, AlignInContainer.Start)
                              DropShadow: =DropShadow.None
                              FillPortions: =If(scrL4Conta.Size = ScreenSize.Small, 0, 1)
                              Height: =44 + 12 + conL4dUtilCartao.Height
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinWidth: =300
                            Children:
                              - btnL4dUtilNovo:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =nfAzul
                                    Color: =nfAzul
                                    Fill: =Color.White
                                    Height: =44
                                    HoverColor: =nfAzul
                                    HoverFill: =nfAzulClaro
                                    OnSelect: |-
                                      =UpdateContext({locL4dUtil: Blank()}); Reset(txtL4dUtilNome); Reset(txtL4dUtilEmail); Reset(drpL4dUtilPerfil); Reset(drpL4dUtilCliente); Reset(chkL4dUtilAtivo); Reset(txtL4dUtilPassword)
                                    PressedColor: =nfAzul
                                    PressedFill: =nfAzulClaro
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Size: =14
                                    Text: ="Novo utilizador"
                                    Width: =180
                              - conL4dUtilCartao:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =nfLinha
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.White
                                    FillPortions: =0
                                    Height: =galL4dUtilizadores.Height + 2
                                    LayoutDirection: =LayoutDirection.Vertical
                                    PaddingBottom: =1
                                    PaddingLeft: =1
                                    PaddingRight: =1
                                    PaddingTop: =1
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                  Children:
                                    - galL4dUtilizadores:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: ="Utilizadores"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          FillPortions: =0
                                          Height: =Max(1, Self.AllItemsCount) * Self.TemplateHeight
                                          Items: =Sort(Utilizadores, Nome)
                                          LayoutMinHeight: =0
                                          OnSelect: |-
                                            =UpdateContext({locL4dUtil: ThisItem}); Reset(txtL4dUtilNome); Reset(txtL4dUtilEmail); Reset(drpL4dUtilPerfil); Reset(drpL4dUtilCliente); Reset(chkL4dUtilAtivo); Reset(txtL4dUtilPassword)
                                          TabIndex: =0
                                          TemplateFill: =If(ThisItem.Utilizador = locL4dUtil.Utilizador, nfAzulFundo, Color.White)
                                          TemplatePadding: =0
                                          TemplateSize: =70
                                        Children:
                                          - lblL4dGUtilNome:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =nfTexto
                                                FontWeight: =FontWeight.Semibold
                                                Height: =28
                                                OnSelect: =Select(Parent)
                                                Size: =14
                                                Text: =ThisItem.Nome & "  ·  " & Text(ThisItem.Perfil)
                                                Width: =Parent.TemplateWidth - 176
                                                Wrap: =false
                                                X: =16
                                                Y: =8
                                          - lblL4dGUtilEmail:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =nfTextoSuave
                                                Height: =24
                                                OnSelect: =Select(Parent)
                                                Text: =ThisItem.Email
                                                Width: =Parent.TemplateWidth - 32
                                                Wrap: =false
                                                X: =16
                                                Y: =38
                                          - btnL4dGUtilEstado:
                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                BorderThickness: =0
                                                Color: =If(If(!ThisItem.Ativo, "Inativo", !IsBlank(ThisItem.'Bloqueado até') && ThisItem.'Bloqueado até' > Now(), "Bloqueado", IsBlank(ThisItem.'Iterações'), "Sem password", "Ativo") = "Ativo", nfVerdeTexto, nfAmbar)
                                                DisabledColor: =Self.Color
                                                DisabledFill: =Self.Fill
                                                DisplayMode: =DisplayMode.View
                                                Fill: =If(If(!ThisItem.Ativo, "Inativo", !IsBlank(ThisItem.'Bloqueado até') && ThisItem.'Bloqueado até' > Now(), "Bloqueado", IsBlank(ThisItem.'Iterações'), "Sem password", "Ativo") = "Ativo", nfVerdeFundo, nfAmbarFundo)
                                                FontWeight: =FontWeight.Bold
                                                Height: =26
                                                HoverColor: =Self.Color
                                                HoverFill: =Self.Fill
                                                OnSelect: =Select(Parent)
                                                PressedFill: =Self.Fill
                                                RadiusBottomLeft: =13
                                                RadiusBottomRight: =13
                                                RadiusTopLeft: =13
                                                RadiusTopRight: =13
                                                Size: =11
                                                TabIndex: =-1
                                                Text: =If(!ThisItem.Ativo, "Inativo", !IsBlank(ThisItem.'Bloqueado até') && ThisItem.'Bloqueado até' > Now(), "Bloqueado", IsBlank(ThisItem.'Iterações'), "Sem password", "Ativo")
                                                Width: =140
                                                X: =Parent.TemplateWidth - Self.Width - 16
                                                Y: =9
                                          - recL4dGUtilSeparador:
                                              Control: Rectangle@2.3.0
                                              Properties:
                                                Fill: =nfLinha
                                                Height: =1
                                                OnSelect: =Select(Parent)
                                                Width: =Parent.TemplateWidth
                                                Y: =Parent.TemplateHeight - 1
                        - conL4dUtilForm:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =If(scrL4Conta.Size = ScreenSize.Small, AlignInContainer.Stretch, AlignInContainer.Start)
                              BorderColor: =nfLinha
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =Color.White
                              FillPortions: =If(scrL4Conta.Size = ScreenSize.Small, 0, 1)
                              Height: =40 + lblL4dUtilTitulo.Height + 10 + lblL4dUtilNomeRot.Height + 10 + 48 + 10 + lblL4dUtilEmailRot.Height + 10 + 48 + 10 + lblL4dUtilPerfilRot.Height + 10 + 48 + If(lblL4dUtilClienteRot.Visible, 10 + lblL4dUtilClienteRot.Height, 0) + If(drpL4dUtilCliente.Visible, 10 + 48, 0) + 10 + 44 + 10 + 44 + 10 + lblL4dUtilPassRot.Height + 10 + 48 + 10 + 44
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutMinWidth: =300
                              PaddingBottom: =20
                              PaddingLeft: =20
                              PaddingRight: =20
                              PaddingTop: =20
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                            Children:
                              - lblL4dUtilTitulo:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =nfAzul
                                    FocusedBorderThickness: =2
                                    FontWeight: =FontWeight.Bold
                                    Size: =18
                                    Text: =If(IsBlank(locL4dUtil), "Novo utilizador", locL4dUtil.Nome)
                              - lblL4dUtilNomeRot:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =nfTextoSuave
                                    FocusedBorderThickness: =2
                                    FontWeight: =FontWeight.Semibold
                                    Text: ="Nome"
                              - txtL4dUtilNome:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    AccessibleLabel: ="Nome do utilizador"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =nfBorda
                                    Default: =locL4dUtil.Nome
                                    Height: =48
                                    HoverBorderColor: =nfAzul
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    TabIndex: =0
                              - lblL4dUtilEmailRot:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =nfTextoSuave
                                    FocusedBorderThickness: =2
                                    FontWeight: =FontWeight.Semibold
                                    Text: ="Email"
                              - txtL4dUtilEmail:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    AccessibleLabel: ="Email do utilizador"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =nfBorda
                                    Default: =locL4dUtil.Email
                                    Height: =48
                                    HoverBorderColor: =nfAzul
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    TabIndex: =0
                              - lblL4dUtilPerfilRot:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =nfTextoSuave
                                    FocusedBorderThickness: =2
                                    FontWeight: =FontWeight.Semibold
                                    Text: ="Perfil"
                              - drpL4dUtilPerfil:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    AccessibleLabel: ="Perfil do utilizador"
                                    AllowEmptySelection: =true
                                    BorderColor: =nfBorda
                                    ChevronBackground: =nfAzul
                                    ChevronFill: =Color.White
                                    Default: =If(IsBlank(locL4dUtil), Blank(), locL4dUtil.Perfil)
                                    Height: =48
                                    HoverFill: =nfAzulFundo
                                    Items: =Choices('Perfil (Utilizadores)')
                                    Items.Value: =Value
                                    PressedColor: =Color.White
                                    PressedFill: =nfAzul
                                    SelectionColor: =Color.White
                                    SelectionFill: =nfAzul
                                    TabIndex: =0
                                    Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                              - lblL4dUtilClienteRot:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =nfTextoSuave
                                    FocusedBorderThickness: =2
                                    FontWeight: =FontWeight.Semibold
                                    Text: ="Cliente associado"
                                    Visible: =drpL4dUtilPerfil.Selected.Value = 'Perfil (Utilizadores)'.Cliente
                              - drpL4dUtilCliente:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    AccessibleLabel: ="Cliente associado ao utilizador"
                                    AllowEmptySelection: =true
                                    BorderColor: =nfBorda
                                    ChevronBackground: =nfAzul
                                    ChevronFill: =Color.White
                                    Default: =If(IsBlank(locL4dUtil.Cliente), Blank(), locL4dUtil.Cliente.Nome)
                                    Height: =48
                                    HoverFill: =nfAzulFundo
                                    Items: =Sort(Clientes, Nome)
                                    Items.Value: =Nome
                                    PressedColor: =Color.White
                                    PressedFill: =nfAzul
                                    SelectionColor: =Color.White
                                    SelectionFill: =nfAzul
                                    TabIndex: =0
                                    Visible: =drpL4dUtilPerfil.Selected.Value = 'Perfil (Utilizadores)'.Cliente
                                    Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                              - chkL4dUtilAtivo:
                                  Control: Classic/CheckBox@2.1.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =nfBorda
                                    CheckboxSize: =24
                                    CheckmarkFill: =nfTexto
                                    Color: =nfTexto
                                    Default: =If(IsBlank(locL4dUtil), true, locL4dUtil.Ativo)
                                    Height: =44
                                    HoverColor: =nfAzul
                                    Size: =14
                                    TabIndex: =0
                                    Text: ="Ativo (pode entrar)"
                              - conL4dUtilAcoes:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =44
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =12
                                  Children:
                                    - btnL4dUtilGuardar:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          Color: =Color.White
                                          Fill: =nfAzul
                                          Height: =44
                                          HoverColor: =Color.White
                                          HoverFill: =nfAzul
                                          OnSelect: |-
                                            =If(
                                                IsBlank(Trim(txtL4dUtilNome.Text)) || !IsMatch(Trim(txtL4dUtilEmail.Text), Match.Email) || IsBlank(drpL4dUtilPerfil.Selected.Value),
                                                UpdateContext({locL4dMsgTipo: "erro", locL4dTimer: false, locL4dMsg: "Preencha o nome, um email válido e o perfil."}),
                                                drpL4dUtilPerfil.Selected.Value = 'Perfil (Utilizadores)'.Cliente && IsBlank(drpL4dUtilCliente.Selected.Cliente),
                                                UpdateContext({locL4dMsgTipo: "erro", locL4dTimer: false, locL4dMsg: "Um utilizador com o perfil Cliente tem de ter um cliente associado."}),
                                                IfError(
                                                    UpdateContext({locL4dUtil: Patch(Utilizadores, If(IsBlank(locL4dUtil), Defaults(Utilizadores), locL4dUtil), {
                                                        Nome: Trim(txtL4dUtilNome.Text),
                                                        Email: Lower(Trim(txtL4dUtilEmail.Text)),
                                                        Perfil: drpL4dUtilPerfil.Selected.Value,
                                                        Cliente: If(drpL4dUtilPerfil.Selected.Value = 'Perfil (Utilizadores)'.Cliente, LookUp(Clientes, Cliente = drpL4dUtilCliente.Selected.Cliente), Blank()),
                                                        Ativo: chkL4dUtilAtivo.Value
                                                    })}),
                                                    UpdateContext({locL4dMsgTipo: "erro", locL4dTimer: false, locL4dMsg: "Não foi possível guardar (o email já existe?). " & FirstError.Message}),
                                                    UpdateContext({locL4dMsgTipo: "ok", locL4dTimer: true, locL4dMsg: If(IsBlank(locL4dUtil.'Iterações'), "Utilizador guardado. Defina-lhe a password para poder entrar.", "Utilizador guardado.")})
                                                )
                                            )
                                          PressedColor: =Color.White
                                          PressedFill: =nfAzul
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Size: =14
                                          Text: ="Guardar"
                                          Width: =150
                                    - btnL4dUtilDesbloquear:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =nfAzul
                                          Color: =nfAzul
                                          Fill: =Color.White
                                          Height: =44
                                          HoverColor: =nfAzul
                                          HoverFill: =nfAzulClaro
                                          OnSelect: |-
                                            =Patch(Utilizadores, locL4dUtil, {'Tentativas falhadas': 0, 'Bloqueado até': Blank()}); UpdateContext({locL4dUtil: LookUp(Utilizadores, Utilizador = locL4dUtil.Utilizador)}); UpdateContext({locL4dMsgTipo: "ok", locL4dTimer: true, locL4dMsg: "Utilizador desbloqueado."})
                                          PressedColor: =nfAzul
                                          PressedFill: =nfAzulClaro
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Size: =14
                                          Text: ="Desbloquear"
                                          Visible: =!IsBlank(locL4dUtil.'Bloqueado até') && locL4dUtil.'Bloqueado até' > Now()
                                          Width: =160
                              - lblL4dUtilPassRot:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =nfTextoSuave
                                    FocusedBorderThickness: =2
                                    FontWeight: =FontWeight.Semibold
                                    Text: ="Definir a password (mínimo 8 caracteres)"
                              - txtL4dUtilPassword:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    AccessibleLabel: ="Nova password do utilizador"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =nfBorda
                                    Default: =""
                                    Height: =48
                                    HintText: ="Nova password"
                                    HoverBorderColor: =nfAzul
                                    Mode: =TextMode.Password
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    TabIndex: =0
                              - btnL4dUtilDefinir:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =nfAzul
                                    Color: =nfAzul
                                    DisplayMode: =If(IsBlank(locL4dUtil) || Len(txtL4dUtilPassword.Text) < 8, DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =Color.White
                                    Height: =44
                                    HoverColor: =nfAzul
                                    HoverFill: =nfAzulClaro
                                    OnSelect: |-
                                      =If(
                                          IsBlank(locL4dUtil),
                                          UpdateContext({locL4dMsgTipo: "erro", locL4dTimer: false, locL4dMsg: "Guarde primeiro o utilizador."}),
                                          With(
                                              {r: IfError(DAC2627_Utilizador_DefinirPassword.Run(gblL4dSessao.token, Text(locL4dUtil.Utilizador), txtL4dUtilPassword.Text, ""), {resultado: "erro", mensagem: "Não foi possível contactar o fluxo. " & FirstError.Message, token: "", nome: "", perfil: "", utilizadorid: "", clienteid: ""})},
                                              Reset(txtL4dUtilPassword);
                                              If(r.resultado = "ok",
                                                  Refresh(Utilizadores); UpdateContext({locL4dUtil: LookUp(Utilizadores, Utilizador = locL4dUtil.Utilizador)}); UpdateContext({locL4dMsgTipo: "ok", locL4dTimer: true, locL4dMsg: r.mensagem}),
                                                  UpdateContext({locL4dMsgTipo: "erro", locL4dTimer: false, locL4dMsg: r.mensagem})
                                              )
                                          )
                                      )
                                    PressedColor: =nfAzul
                                    PressedFill: =nfAzulClaro
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Size: =14
                                    Text: ="Definir password"
                                    Width: =200
                  - conL4dVistaPassword:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        BorderColor: =nfLinha
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =Color.White
                        FillPortions: =0
                        Height: =30 + 10 + lblL4dPassAtualRot.Height + 10 + 48 + 10 + lblL4dPassNovaRot.Height + 10 + 48 + 10 + lblL4dPassConfirmaRot.Height + 10 + 48 + 10 + 44
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        PaddingBottom: =20
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =20
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Visible: =gblL4Nivel = "revisao" && gblL4dArea = "password"
                        Width: =If(scrL4Conta.Size = ScreenSize.Small, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight, 560)
                      Children:
                        - lblL4dPassAtualRot:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =nfTextoSuave
                              FocusedBorderThickness: =2
                              FontWeight: =FontWeight.Semibold
                              Text: ="Password atual"
                        - txtL4dPassAtual:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              AccessibleLabel: ="Password atual"
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =nfBorda
                              Default: =""
                              Height: =48
                              HoverBorderColor: =nfAzul
                              Mode: =TextMode.Password
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              TabIndex: =0
                        - lblL4dPassNovaRot:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =nfTextoSuave
                              FocusedBorderThickness: =2
                              FontWeight: =FontWeight.Semibold
                              Text: ="Nova password (8 a 128 caracteres)"
                        - txtL4dPassNova:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              AccessibleLabel: ="Nova password"
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =nfBorda
                              Default: =""
                              Height: =48
                              HoverBorderColor: =nfAzul
                              Mode: =TextMode.Password
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              TabIndex: =0
                        - lblL4dPassConfirmaRot:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =nfTextoSuave
                              FocusedBorderThickness: =2
                              FontWeight: =FontWeight.Semibold
                              Text: ="Confirmar a nova password"
                        - txtL4dPassConfirma:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              AccessibleLabel: ="Confirmar a nova password"
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =nfBorda
                              Default: =""
                              Height: =48
                              HoverBorderColor: =nfAzul
                              Mode: =TextMode.Password
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              TabIndex: =0
                        - btnL4dPassMudar:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =nfAzul
                              Color: =Color.White
                              Fill: =nfAzul
                              Height: =44
                              HoverColor: =Color.White
                              HoverFill: =nfAzul
                              OnSelect: |-
                                =If(
                                    Len(txtL4dPassNova.Text) < 8 || Len(txtL4dPassNova.Text) > 128,
                                    UpdateContext({locL4dMsgTipo: "erro", locL4dTimer: false, locL4dMsg: "A nova password tem de ter entre 8 e 128 caracteres."}),
                                    txtL4dPassNova.Text <> txtL4dPassConfirma.Text,
                                    UpdateContext({locL4dMsgTipo: "erro", locL4dTimer: false, locL4dMsg: "A confirmação não é igual à nova password."}),
                                    With(
                                        {r: IfError(DAC2627_Utilizador_DefinirPassword.Run(gblL4dSessao.token, "", txtL4dPassNova.Text, txtL4dPassAtual.Text), {resultado: "erro", mensagem: "Não foi possível contactar o fluxo. " & FirstError.Message, token: "", nome: "", perfil: "", utilizadorid: "", clienteid: ""})},
                                        Reset(txtL4dPassAtual); Reset(txtL4dPassNova); Reset(txtL4dPassConfirma);
                                        If(r.resultado = "ok", UpdateContext({locL4dMsgTipo: "ok", locL4dTimer: true, locL4dMsg: r.mensagem}), UpdateContext({locL4dMsgTipo: "erro", locL4dTimer: false, locL4dMsg: r.mensagem}))
                                    )
                                )
                              PressedColor: =Color.White
                              PressedFill: =nfAzul
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =14
                              Text: ="Mudar password"
                              Width: =If(scrL4Conta.Size = ScreenSize.Small, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight, 220)
      - conL4dCMensagem:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =If(locL4dMsgTipo = "erro", nfVermelhoFundo, nfVerdeFundo)
            Height: =Max(56, lblL4dCMensagem.Height + 16)
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            PaddingBottom: =8
            PaddingLeft: =16
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Visible: =!IsBlank(locL4dMsg)
            Width: =Min(560, Parent.Width - 32)
            X: =(Parent.Width - Self.Width) / 2
            Y: =76
          Children:
            - icoL4dCMsgIcone:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =If(locL4dMsgTipo = "erro", "Erro", "Sucesso")
                  Color: =If(locL4dMsgTipo = "erro", nfVermelho, nfVerde)
                  Height: =24
                  Icon: =If(locL4dMsgTipo = "erro", Icon.Warning, Icon.Check)
                  Width: =24
            - lblL4dCMensagem:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =If(locL4dMsgTipo = "erro", nfVermelhoTexto, nfVerdeTexto)
                  FillPortions: =1
                  FocusedBorderThickness: =2
                  FontWeight: =FontWeight.Semibold
                  Text: =locL4dMsg
            - icoL4dCFecharMsg:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Fechar mensagem"
                  Color: =nfTextoSuave
                  Height: =44
                  Icon: =Icon.Cancel
                  OnSelect: |-
                    =UpdateContext({locL4dMsg: "", locL4dTimer: false})
                  TabIndex: =0
                  Width: =44
      - tmrL4dCMensagem:
          Control: Timer@2.1.0
          Properties:
            Duration: =5000
            OnTimerEnd: |-
              =UpdateContext({locL4dMsg: "", locL4dTimer: false})
            Start: =locL4dTimer
            Visible: =false
