[project]
name = "dac2627-tools"
version = "1.1.0"
description = "Ferramentas de qualidade e ALM da APP DAC2627 (Power Apps)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
